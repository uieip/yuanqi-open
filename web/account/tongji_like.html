<uieip type="page" value="login"></uieip>
<uieip type="reg" value="console,login,session"></uieip>
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 主题引导：首屏绘制前同步应用 data-theme 与临界底色，防止主题闪烁 -->
    <script src="/scripts/theme-boot.js"></script>
    <!-- Element Plus 暗色变量：html.dark 由 src/theme.ts 按主题切换时挂载 -->
    <link rel="stylesheet" href="/scripts/vue/element-plus/dark/css-vars.css">
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
    <uieip type="tmpl" value="model.title"></uieip>
    <style>
        #app {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; overflow: hidden;display: block;">
    <div id="app" style="padding: 2px; ">
        <yq-data-grid ref="mRef" v-bind="mProps"></yq-data-grid>
    </div>
    <script>
        const { createApp, onMounted, ref, computed } = Vue;
        const { initTheme, YqMessage, YqWindowApi, YqDataGrid, YqTongjiPub } = YqwinPlus;
        initTheme();

        <uieip type="tmpl" value="model.params"></uieip>

        let mainParams = {
            m_tb: _tb
        };

        window.onload = function () {
            initApp();
        }

        const initApp = () => {
            const app = createApp({
                components: {
                    YqDataGrid
                },
                setup() {
                    const mRef = ref(null);
                    const selectedRow = ref(null);
                    const mProps = computed(() => ({
                        ...mainParams.m_tb,
                        menuType: 3,
                        loadTitles: false,
                        loadData: true,
                        btnMini: false,
                        editLinks: [{
                            name: "like0",
                            label: "点赞",
                            toptip: "点赞",
                            icon: "fa fa-star",
                            type: "success",
                            disabled: () => {
                                if (!selectedRow.value) {
                                    return true;
                                }
                                return selectedRow.value.isdel === false;
                            },
                            click: async () => {
                                let opt = {
                                    "action": "like",
                                    "url": selectedRow.value.url
                                };
                                const res = await YqTongjiPub.submit(opt, "");
                                if (res.error !== 0) {
                                    YqMessage.error(res.info);
                                    return;
                                }
                                selectedRow.value.isdel = false;
                                mRef.value.updateCellContent({
                                    sid: selectedRow.value.sid,
                                    name: "isdel",
                                    value: false,
                                });
                                YqMessage.success({
                                    message: "点赞成功",
                                    labelDict: {
                                        "zh-CN": { message: "点赞成功" },
                                        "en": { message: "Like succeeded" },
                                    },
                                });
                            }
                        },{
                            divided: true,
                        },{
                            name: "like1",
                            label: "取消点赞",
                            toptip: "取消点赞",
                            icon: "fa fa-times",
                            type: "danger",
                            disabled: () => {
                                if (!selectedRow.value) {
                                    return true;
                                }
                                return selectedRow.value.isdel === true;
                            },
                            click: async () => {
                                let opt = {
                                    "action": "unlike",
                                    "url": selectedRow.value.url
                                };
                                const res = await YqTongjiPub.submit(opt, "");
                                console.log("取消点赞", opt, res);
                                if (res.error !== 0) {
                                    YqMessage.error(res.info);
                                    return;
                                }
                                selectedRow.value.isdel = true;
                                mRef.value.updateCellContent({
                                    sid: selectedRow.value.sid,
                                    name: "isdel",
                                    value: true,
                                });
                                YqMessage.success({
                                    message: "取消点赞成功",
                                    labelDict: {
                                        "zh-CN": { message: "取消点赞成功" },
                                        "en": { message: "Unlike succeeded" },
                                    },
                                });
                            }
                        }],
                        labelDict: {
                            like0: {
                                "zh-CN": {
                                    label: "点赞",
                                    toptip: "点赞",
                                },
                                "en": {
                                    label: "Like",
                                    toptip: "Like",
                                },
                            },
                            like1: {
                                "zh-CN": {
                                    label: "取消点赞",
                                    toptip: "取消点赞",
                                },
                                "en": {
                                    label: "Unlike",
                                    toptip: "Unlike",
                                },
                            },
                        },
                        beforeSetData: async (rows) => {
                            //console.log("beforeSetData", rows);
                            let _rows = [];
                            for (let row of rows) {
                                _rows.push({
                                    url: row.url,
                                    action: "like",
                                });
                            }
                            const res = await YqTongjiPub.infos(_rows, "");
                            //console.log("beforeSetData", res);

                            if (res.error !== 0) {
                                YqMessage.error(res.info);
                                return [];
                            }

                            for (let row of rows) {
                                let item = res.rows.find(item => item.url === row.url);
                                if (item && item.value.s_like !== undefined) {
                                    row.isdel = !item.value.s_like;
                                } else {
                                    row.isdel = true;
                                }
                            }

                            return rows;
                        },
                        onRowClick: ({ row, index, key }) => {
                            console.log(row, index, key);
                            selectedRow.value = row;
                        }
                    }));

                    onMounted(async () => {
                        await mRef.value.initTitles();
                    });

                    return {
                        mRef,
                        mProps
                    }
                }
            })
            app.use(ElementPlus);
            app.mount('#app');
        }

        window.YqwinPlus = {
            YqWindowApi: YqWindowApi,
        }
    </script>
</body>

</html>
