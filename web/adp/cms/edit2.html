<!doctype html>
<uieip type="page" value="login"></uieip>
<uieip type="reg" value="console"></uieip>
<html>

<head>
    <!-- 主题引导：首屏绘制前同步应用 data-theme 与临界底色，防止主题闪烁 -->
    <script src="/scripts/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入 Font Awesome CSS -->
    <link rel="stylesheet" type="text/css" href="/font-awesome.min.css">
    <title>cms model edit</title>
</head>

<body style="margin: 0px;">
    <div id="editor" style="width: 100%;height:100vh;">
        <yq-file-edit :is-edit="isEdit" :file-path="filePath" :go-doc-end="goDocEnd" :runfile="runfile" :cms="cms"
            :mobile="mobile"></yq-file-edit>
    </div>

     <script type="module">
        import { createApp, onMounted, ref, nextTick } from 'vue'
        import ElementPlus from 'element-plus'
        import { ElSelect, ElOption  } from 'element-plus'
        import { initTheme, YqFileEdit  } from '/src';
        import zhCn from 'element-plus/es/locale/lang/zh-cn'
        import 'element-plus/dist/index.css'
        import 'element-plus/theme-chalk/dark/css-vars.css'
        initTheme();

        const mainParams = {
            path: '',
            mobile: ''
        };

        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            mainParams.path = urlParams.get('path') || mainParams.path;
            mainParams.mobile = urlParams.get('mobile') || mainParams.mobile;
            console.log(mainParams);

            initApp();
        }

        const initApp = () => {

            const app = createApp({
                components: {
                    YqFileEdit
                },
                setup() {
                    // 基本状态
                    const isEdit = ref(true);
                    const goDocEnd = ref(false);
                    const runfile = ref(true);

                    // 示例文件数据
                    const filePath = ref(mainParams.path);
                    const mobile = ref(mainParams.mobile);

                    return {
                        isEdit,
                        goDocEnd,
                        runfile,
                        filePath,
                        cms: true,
                        mobile
                    };
                }
            });

            app.mount('#editor');
        }

    </script>
</body>

</html>
