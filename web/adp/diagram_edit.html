<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 主题引导：首屏绘制前同步应用 data-theme 与临界底色，防止主题闪烁 -->
    <script src="/scripts/theme-boot.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据库关系图</title>
    <link rel="stylesheet" type="text/css" href="/scripts/vue/font-awesome/font-awesome.min.css" />
    <!-- 引入基础样式 -->
    <style>
        /* 添加 v-cloak 样式 */
        [v-cloak] {
            display: none;
        }

        /* 页面样式调整 */
        body {
            display: block;
            margin: 0;
            padding: 0;
        }

        #app {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; overflow: hidden;">
    <div id="app" style="padding: 5px;">
        <yq-chart-db-rel v-model="chartData" :is-edit="isEdit" :mini="mini" :on-save="onSave"
            :select-table="selectTable" />
    </div>
    <script type="module" lang="ts">
        import { createApp, ref, watch, onMounted } from 'vue'
        import ElementPlus from 'element-plus'
        import 'element-plus/dist/index.css'
        import 'element-plus/theme-chalk/dark/css-vars.css'
        import zhCn from 'element-plus/es/locale/lang/zh-cn'
        import YqUiMaskEdit from '/src/components/form/YqUiMaskEdit.vue'
        import { initTheme, YqMessage, YqChartDbRel, yqData, YqWindowApi  } from '/src';
        initTheme();

        let mainParams = {
            dbname: "yqbase",
            sid: null,
            parent: null,
            table: {
                tbname: "sys_tb",
                keyId: "sid",
                displayMember: "name",
                bindingKeyId: null,
                bindingValue: null,
                pKeyId: "pid",
                pKeyValue: null,

                tempno: -1,
                addWhere: "",
                order: "queue",
                loadDataType: 2,
                loadTitles: true,
                loadData: true,
                isEdit: false,
                showMenu: false,

                getNodeIcon: (data) => {
                    return data.tb_type === 0 ? "fa fa-folder" : "fa fa-table";
                },
                getNodeLabel: (data) => {
                    return data.tb_type === 0 ? (data.describe ?? data.name) : ((data.describe ?? '') + "[" + (data.name ?? '') + "]");
                },
            },
        };

        const defaultSampleData = {
            "info": {
                "name": "测试数据库关系图",
                "describe": "这是一个数据库关系图测试"
            },
            "nodes": [{
                "key": "Record1",
                "name": "Record1",
                "isdata": true,
                "loc": "-285 -58",
                "fields": [{
                    "name": "field1",
                    "info": "",
                    "type": 1
                }, {
                    "name": "field2",
                    "info": "the second one",
                    "type": 1
                }, {
                    "name": "fieldThree",
                    "info": "3rd",
                    "type": 2
                }, {
                    "name": "fieldThree2",
                    "info": "time",
                    "type": 3
                }]
            }, {
                "key": "Record2",
                "name": "Record2",
                "isdata": false,
                "loc": "73 36",
                "fields": [{
                    "name": "fieldA",
                    "info": "",
                    "type": 6
                }, {
                    "name": "fieldB",
                    "info": "",
                    "type": 7
                }, {
                    "name": "fieldC",
                    "info": "",
                    "type": 9
                }, {
                    "name": "fieldD",
                    "info": "fourth"
                }]
            }, {
                "key": "Record3",
                "name": "Record3",
                "isdata": true,
                "loc": "-285 200",
                "fields": [{
                    "name": "id",
                    "info": "主键",
                    "type": 6
                }, {
                    "name": "name",
                    "info": "名称",
                    "type": 1
                }, {
                    "name": "amount",
                    "info": "金额",
                    "type": 2
                }]
            }, {
                "key": "Record4",
                "name": "维度表",
                "isdata": false,
                "loc": "100 220",
                "fields": [{
                    "name": "dim_id",
                    "info": "维度ID",
                    "type": 6
                }, {
                    "name": "dim_name",
                    "info": "维度名称",
                    "type": 7
                }]
            }],
            "links": [{
                "from": "Record1",
                "fromPort": "field1",
                "to": "Record2",
                "toPort": "fieldA",
                "join": 1
            }, {
                "from": "Record1",
                "fromPort": "fieldThree",
                "to": "Record2",
                "toPort": "fieldB",
                "join": 2
            }, {
                "from": "Record1",
                "to": "Record2",
                "fromPort": "field2",
                "toPort": "fieldD",
                "join": 3
            }, {
                "from": "Record3",
                "fromPort": "id",
                "to": "Record4",
                "toPort": "dim_id",
                "join": 2
            }, {
                "from": "Record3",
                "fromPort": "name",
                "to": "Record4",
                "toPort": "dim_name",
                "join": 1
            }]
        };

        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            mainParams.dbname = urlParams.get('dbname') || mainParams.dbname;
            mainParams.sid = urlParams.get('sid') || "aed17c46-bbad-4332-b2f4-fe30ca136c00";
            if (window.parent !== window.self) {
                mainParams.parent = window.parent;
            }

            initApp();
        }

        const initApp = () => {
            const app = createApp({
                components: {
                    YqChartDbRel
                },
                setup() {
                    const isEdit = ref(true);
                    const mini = ref(false);
                    const chartData = ref([]);

                    let editRow = {};

                    const selectTable = async (event) => {
                        console.log('selectTable event:', event);
                        // // 模拟添加表
                        // const newKey = 'NewTable_' + Date.now();
                        // const newNode = {
                        //     key: newKey,
                        //     name: newKey,
                        //     isdata: true,
                        //     loc: "0 0",
                        //     fields: [
                        //         { name: "id", info: "主键", type: 6 },
                        //         { name: "name", info: "名称", type: 1 }
                        //     ]
                        // };
                        // return newNode;
                        const newNode = await showSelectTb(event.target);

                        return newNode;
                    };

                    const showSelectTb = async (el) => {
                        let popperId = '';

                        let parent = true;
                        if (!window.parent || window.parent === window) {
                            parent = false;
                        }

                        let height = window.innerHeight - 100;
                        let width = window.innerWidth - 100;
                        if (height < 800) {
                            height = 800;
                        }
                        if (height < 400) {
                            height = 400;
                        }
                        if (width > 500) {
                            width = 500;
                        }
                        if (width < 300) {
                            width = 300;
                        }

                        return new Promise((resolve) => {
                            const content = {
                                h: 'div',
                                props: {
                                    style: {
                                        padding: '5px',
                                        height: '100%',
                                    }
                                },
                                children: {
                                    h: 'YqDataTree',
                                    props: {
                                        ...mainParams.table,
                                        menuType: 3,
                                        dbname: mainParams.dbname,
                                        height: height - 10,
                                        onRowDoubleClick: async ({ row }) => {
                                            //console.log('onRowDoubleClick row:', row);
                                            if (row.tb_type == 0) {
                                                return;
                                            }

                                            const res = await yqData.tbTitle({
                                                dbname: mainParams.dbname,
                                                tbname: row.name,
                                                tempno: -1,
                                            });

                                            //console.log('res:', res);
                                            if (res.error != 0) {
                                                YqMessage.error(res.info + "["+ res.error + "]");
                                                return;
                                            }

                                            let fields = [];
                                            for (let i = 0; i < res.titles.length; i++) {
                                                fields.push({
                                                    name: res.titles[i].name,
                                                    title: res.titles[i].ui_title,
                                                    type: res.titles[i].ui_type,
                                                });
                                            }

                                            // 模拟添加表
                                            const newNode = {
                                                name: row.name,
                                                isdata: true,
                                                fields: fields
                                            };

                                            YqWindowApi.close(popperId, parent);
                                            resolve(newNode);
                                        }
                                    }
                                }
                            }

                            const options = {
                                containerRef: el,
                                placement: 'popper',
                                showTitle: false,
                                modal: false,
                                top: 30,
                                left: 0,
                                width: width,
                                height: height,
                                fullscreen: false,
                                type: 'param',
                                content: content,
                                overflow: 'hidden',
                                showFooter: false,
                                parent: parent,
                            }

                            popperId = YqWindowApi.show(options);
                        });
                    }


                    const onSave = async (event, data) => {
                        console.log('save event:', event, 'data:', data);

                        if (!mainParams.parent || !mainParams.parent.updateDiagram) {
                            YqMessage.error({
                                message: '父窗口不存在或不支持更新关系图',
                                labelDict: {
                                    "zh-CN": { message: '父窗口不存在或不支持更新关系图' },
                                    "en": { message: 'Parent window does not exist or does not support updating the diagram' },
                                },
                            });
                            return;
                        }

                        if (data.info) {
                            let keys = ['code', 'describe', 'root_tb', 'remark'];
                            for (let key of keys) {
                                if (data.info[key]) {
                                    editRow[key] = data.info[key]
                                } else {
                                    delete editRow[key];
                                }
                            }
                        }
                        editRow.data = JSON.stringify(data);

                        const rows = [{
                            action: editRow.sid ? 'upp' : 'add',
                            row: editRow
                        }];
                        const res = await yqData.dbAction({
                            dbname: mainParams.dbname,
                            tbname: 'sys_tb_diagram',
                            rows: rows
                        });

                        editRow.sid = res.rows[0].sid;
                        YqMessage.success({
                            message: '保存成功',
                            labelDict: {
                                "zh-CN": { message: '保存成功' },
                                "en": { message: 'Save succeeded' },
                            },
                        });

                        if (mainParams.parent && mainParams.parent.updateDiagram) {
                            await mainParams.parent.updateDiagram({
                                rows: rows,
                                res: res
                            });
                        }
                    };

                    onMounted(async () => {
                        try {
                            if (!mainParams.sid) {
                                return;
                            }
                            const res = await yqData.dbTbRow({
                                dbname: mainParams.dbname,
                                tbname: 'sys_tb_diagram',
                                keyid: 'sid',
                                keyval: mainParams.sid
                            });
                            console.log(res);
                            if (res.error == 0) {
                                if (res.row) {
                                    editRow = res.row;
                                    chartData.value = res.row.data ? JSON.parse(res.row.data) || [] : [];
                                } else {
                                    YqMessage.error({
                                        message: '获取图表数据失败',
                                        labelDict: {
                                            "zh-CN": { message: '获取图表数据失败' },
                                            "en": { message: 'Failed to load diagram data' },
                                        },
                                    });
                                }
                            } else {
                                YqMessage.error(res.info || '获取图表数据失败');
                            }
                        } catch (error) {
                            console.error('Error in onMounted:', error);
                            YqMessage.error(error.message || '获取图表数据失败');
                        }
                    });

                    return {
                        isEdit,
                        mini,
                        chartData,
                        onSave,
                        selectTable
                    };
                }
            });

            app.use(ElementPlus, {})
            app.mount('#app')
        }
    </script>
</body>

</html>
