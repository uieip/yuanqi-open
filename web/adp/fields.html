<body style="margin: 0; padding: 0; overflow: hidden;">

        <yq-container :header-height="'45px'" v-model:footer-height="footerH">

                    </yq-con-main>
                    <yq-con-aside style="padding: 0 0 0 1px;">

            </yq-con-main>
            <yq-con-footer style="padding: 0;">
                <yq-tabs v-model="activeTab" @tab-click="tabsClick" :label-dict="tabLabelDict">
                    <yq-tab-pane label="模板" name="template">
                        <div style="padding:4px 0; margin: 0;" class="control-group">
                            <!-- 1-表格 2-Html模板 3-Code代码 -->

                        </div>
                        <div style="position: relative;height: calc(100% - 40px);" @contextmenu="onTbuiContextMenu">
                            <yq-data-grid ref="tbuiRef" v-bind="tbuiProps"></yq-data-grid>
                        </div>
                    </yq-tab-pane>
                    <yq-tab-pane label="关联设置" name="link">
                        <yq-data-grid ref="tbfkRef" v-bind="tbfkProps"></yq-data-grid>
                    </yq-tab-pane>
                </yq-tabs>
            </yq-con-footer>
        </yq-container>
    </div>
    <script>
        const { ref, onMounted, onBeforeUnmount, createApp, nextTick, computed } = Vue;
        const { ElSelect, ElOption } = ElementPlus;
        const { initTheme,
            YqMessage, YqEdit, YqDataGrid, YqWindowApi, YqMessageBox, YqIcon, YqUiMaskEdit, yqData, yqUiPub, YqTabs, YqTabPane, YqButton, YqMenu, YqContainer, YqConHeader, YqConAside, YqConMain, YqConFooter } = YqwinPlus;
        initTheme();

        //?dbname=yqbase&tb_id=6c93e540-0797-42c9-ae43-ad5db8184aaa
        //dbname=yqbase&tb_id=ef6f49d0-46b0-4e87-b98d-37ff229a61f1
        let mainParams = {
            dbname: "yqbase",
            tb_id: "f9542919-655f-4aae-b82a-f221e8c64427",
            footerH: 260,
        };

        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            mainParams.dbname = urlParams.get('dbname') || mainParams.dbname;
            mainParams.tb_id = urlParams.get('tb_id') || mainParams.tb_id;
            console.log(mainParams);

            mainParams.footerH = window.innerHeight * 0.32;
            if (mainParams.footerH < 260) {
                mainParams.footerH = 260;
            }

            initApp();
        }

        const initApp = () => {
            const app = createApp({
                components: {
                    YqEdit,
                    YqDataGrid,
                    YqUiMaskEdit,
                    YqIcon,
                    YqTabs,
                    YqTabPane,
                    YqButton,
                    YqMenu,
                    YqContainer,
                    YqConHeader,
                    YqConAside,
                    YqConMain,
                    YqConFooter,
                },
                data() {
                    return {
                        tbview: {
                            titles: [{
                                "name": "db_name",
                                "ui_title": "数据库",
                                "fd_type": "nvarchar",
                                "length": 50,
                                "decimal": 0,
                                "ui_type": 2,
                                "ui_width": 150,
                                "ui_visible": true,
                                "ui_readonly": false,
                                "ui_mask": {}
                            },
                            {
                                "name": "name",
                                "ui_title": "名称",
                                "fd_type": "nvarchar",
                                "length": 50,
                                "decimal": 0,
                                "ui_type": 2,
                                "ui_width": 150,
                                "ui_visible": true,
                                "ui_readonly": false,
                                "ui_mask": {}
                            }, {
                                "name": "describe",
                                "ui_title": "表描述",
                                "fd_type": "nvarchar",
                                "length": 0,
                                "decimal": 0,
                                "ui_type": 2,
                                "ui_width": 150,
                                "ui_visible": true,
                                "ui_readonly": false,
                                "ui_mask": {}
                            }, {
                                "name": "tb_name",
                                "ui_title": "实际表名",
                                "fd_type": "nvarchar",
                                "length": 0,
                                "decimal": 0,
                                "ui_type": 2,
                                "ui_width": 150,
                                "ui_visible": true,
                                "ui_readonly": false,
                                "ui_mask": {}
                            }, {
                                "name": "vi_name",
                                "ui_title": "视图名称",
                                "fd_type": "nvarchar",
                                "length": 0,
                                "decimal": 0,
                                "ui_type": 2,
                                "ui_width": 150,
                                "ui_visible": true,
                                "ui_readonly": false,
                                "ui_mask": {}
                            }, {
                                "name": "proc",
                                "ui_title": "存储过程",
                                "fd_type": "nvarchar",
                                "length": 0,
                                "decimal": 0,
                                "ui_type": 2,
                                "ui_width": 150,
                                "ui_visible": true,
                                "ui_readonly": false,
                                "ui_mask": {}
                            }
                            ],
                            model: `
<table style="white-space: nowrap;">
    <tbody>    
        <tr>
            <td><label id="lbl_db_name" style="white-space: nowrap;">数据库</label></td>
            <td><input id="txt_db_name" type="text" style="width: 80px;"></td>
            <td><label id="lbl_name" style="white-space: nowrap;">名称</label></td>
            <td><input id="txt_name" type="text"  style="width: 150px;"></td>
            <td><label id="lbl_describe" style="white-space: nowrap;">描述</label></td>
            <td><input id="txt_describe" type="text" style="width: 150px;"></td>
            <td><label id="lbl_tb_name" style="white-space: nowrap;">实际表名</label></td>
            <td><input id="txt_tb_name" type="text" style="width: 150px;"></td>
        </tr>
    </tbody>
</table>`,
                            fkrows: [],
                        }
                    }
                },
                setup() {
                    const mainRef = ref(null);

                    const footerH = ref(mainParams.footerH);

                    const fieldRef = ref(null);
                    const tbuiRef = ref(null);
                    const tbfkRef = ref(null);

                    const tb_row = ref({});

                    const editUiType = ref(1);
                    const editUiMask = ref({});
                    const editIsEdit = ref(false);

                    const field = ref({
                        dbname: mainParams.dbname,
                        tbname: 'sys_tb_field',
                        keyId: 'sid',
                        bindingKeyId: 'tb_id',
                        bindingValue: mainParams.tb_id,
                        tempno: 1,
                        loadTitles: false, //是否加载标题
                        loadData: false,
                        isPage: false,
                        order: "queue",
                        editMode: 1,

                        frozenNum: 2,

                        moveModeW: "800",
                        moveModeH: "600",
                        moveModeNo: 1,

                        dbClickEdit: true,

                        showMenu: true,
                        isEdit: true,
                        btnMini: true,
                        topnum: 6,  //水平菜单数量
                        add: true,
                        upp: true,
                        del: true,
                        move: true,
                        toExcel: true,
                        excelName: "excel导出",
                        isSimple: false,
                        isSeek: false,
                    });

                    const tbui = ref({
                        dbname: mainParams.dbname,
                        tbname: 'sys_tb_ui',
                        keyId: 'sid',
                        bindingKeyId: 'tb_id',
                        bindingValue: mainParams.tb_id,
                        tempno: 1,
                        loadTitles: false, //是否加载标题
                        loadData: false,
                        isPage: false,
                        order: "no",
                        editMode: 3,
                        dbClickEdit: false,
                        showMenu: false,
                        isEdit: false,
                        isSimple: false,
                        isSeek: false,
                    });

                    const tbfk = ref({
                        dbname: mainParams.dbname,
                        tbname: 'sys_tb_fk',
                        keyId: 'sid',
                        bindingKeyId: 'tb_id',
                        bindingValue: mainParams.tb_id,
                        tempno: 1,
                        loadTitles: false, //是否加载标题
                        loadData: true,
                        isPage: false,
                        order: "queue",
                        editMode: 3,
                        editModeW: 500,
                        editModeH: 350,
                        editPlacement: "popper",
                        editModeNo: 1,

                        moveModeW: "800",
                        moveModeH: "600",
                        moveModeNo: 1,

                        dbClickEdit: true,

                        showMenu: true,
                        isEdit: true,
                        btnMini: true,
                        topnum: 7,  //水平菜单数量
                        copy: false,
                        add: true,
                        upp: true,
                        del: true,
                        move: true,
                        editLinks: [],
                        isSimple: false,
                        isSeek: false,
                    });

                    const transShow = (event) => {
                        let height = mainRef.value?.$el.clientHeight ?? 630;
                        let top = 30;
                        let left = -50;
                        let editH = height - 113;
                        const s = YqWindowApi.show({
                            containerRef: event.target,
                            placement: 'popper',
                            title: "语言",
                            width: 625,
                            height: height,
                            left: left,
                            top: top,
                            type: 'iframe',
                            content: `trans.html?dbname=${mainParams.dbname}&type=3&name=${mainParams.tbname}&height=${editH}`,
                            parent: true,
                            overflow: 'none',
                            showFooter: false,
                        });
                    }

                    const field_editLinks_r = ref([
                        {
                            name: 'delall',
                            label: '删除全部字段',
                            toptip: '删除全部字段',
                            icon: 'fa fa-trash',
                            type: "primary",
                            divided: false,
                            disabled: (() => {
                                return false;
                            }),
                            click: async (e) => {
                                await fieldRef.value.menuClick('delall');
                            }
                        },
                        {
                            name: 'loadfields',
                            label: '加载字段信息',
                            toptip: '加载字段信息',
                            icon: 'fa fa-refresh',
                            type: "primary",
                            divided: false,
                            disabled: (() => {
                                return false;
                            }),
                            click: async (e) => {
                                const res = await yqData.tbFields({
                                    dbname: mainParams.dbname,
                                    tbname: mainParams.tbname,
                                });
                                if (res.error != 0) {
                                    YqMessage.error(res.info + '[' + res.error + ']');
                                    return;
                                }

                                const rows = fieldRef.value.rows();
                                console.log(res, rows);

                                for (let i = 0; i < res.rows.length; i++) {
                                    const row = res.rows[i];
                                    let hasRow = false;
                                    for (let j = 0; j < rows.length; j++) {
                                        if (row.name == rows[j].name) {
                                            if (row.name == rows[j].name) {
                                                if (row.fd_type != rows[j].fd_type) {
                                                    fieldRef.value.updateCellContent({ sid: rows[j].sid, name: "fd_type", value: row["fd_type"] });
                                                }
                                                if (row.length != rows[j].length) {
                                                    fieldRef.value.updateCellContent({ sid: rows[j].sid, name: "length", value: row["length"] });
                                                }
                                                if (row.decimal != rows[j].decimal) {
                                                    fieldRef.value.updateCellContent({ sid: rows[j].sid, name: "decimal", value: row["decimal"] });
                                                }
                                            }

                                            hasRow = true;
                                            break;
                                        }
                                    }
                                    if (!hasRow) {
                                        fieldRef.value.addRow(row);
                                    }
                                }
                            }
                        },
                        {
                            divided: true,
                        },
                        {
                            name: 'viewdata',
                            label: '查看数据',
                            toptip: '查看数据',
                            icon: 'fa fa-eye',
                            type: "primary",
                            divided: false,
                            disabled: (() => {
                                return false;
                            }),
                            click: async (e) => {

                            }
                        }, {
                            name: "language",
                            label: "语言",
                            toptip: "语言",
                            icon: "fa fa-language",
                            type: "primary",
                            disabled: () => {
                                return false;
                            },
                            click: (event) => {
                                transShow(event);
                            }
                        }, {
                            name: 'delcache',
                            label: '清理登录缓存',
                            toptip: '清理登录缓存',
                            icon: 'fa fa-eraser',
                            type: "primary",
                            divided: false,
                            disabled: (() => {
                                return false;
                            }),
                            click: async (e) => {
                                YqMessageBox.confirm({
                                    message: '确定清理缓存...',
                                    title: '提示',
                                    type: 'message',
                                    el: e.target,
                                }).then(async () => {
                                    await yqData.clearCache("ui:" + mainParams.tbname + ":");
                                }).catch(() => {
                                    //console.log('用户点击了取消');
                                });
                            }
                        }
                    ]);

                    const field_markdown = () => {
                        var rows = fieldRef.value.rows();
                        if (rows.length == 0) {
                            YqMessage.error({
                                message: "请先加载字段信息",
                                labelDict: {
                                    "zh-CN": { message: "请先加载字段信息" },
                                    "en": { message: "Please load field information first" },
                                },
                            });
                            return;
                        }

                        var escapeMarkdown = function (text) {
                            // 转义 Markdown 特殊字符
                            return text
                                .replace(/\|/g, "\\|") // 转义 |
                                .replace(/#/g, "\\#") // 转义 #
                                .replace(/\*/g, "\\*") // 转义 *
                                .replace(/_/g, "\\_") // 转义 _
                                .replace(/~/g, "\\~"); // 转义 ~
                        }

                        let md_tb = tb_row.value.describe + "[" + tb_row.value.name + "]\n\n";
                        // 表头
                        md_tb += "| No. | 字段名 | 标题 | 字段类型 | 备注 |\n";
                        md_tb += "| -- | --- | --- | --- | --- |\n";
                        // 遍历每一行数据
                        rows.forEach((row, index) => {
                            const no = index + 1; // 序号
                            const name = escapeMarkdown(row.name || "");
                            const ui_title = escapeMarkdown(row.ui_title || "");
                            const fd_type = escapeMarkdown(row.fd_type || "");
                            var remark = escapeMarkdown(row.remark?.html || "");
                            if (row.ui_type == 6 || row.ui_type == 13) {
                                if (row.ui_mask) {
                                    var ui_mask_str = "";
                                    const ui_mask = JSON.parse(row.ui_mask);
                                    if (ui_mask.lists) {
                                        ui_mask.lists.forEach((list, index_1) => {
                                            ui_mask_str += (ui_mask_str == "" ? "" : ",") + `${list.no}:${list.name}`;
                                        });
                                    }
                                    remark += escapeMarkdown(ui_mask_str);
                                }
                            }

                            md_tb += `| ${no} | ${name} | ${ui_title} | ${fd_type} | ${remark} |\n`;
                        });

                        navigator.clipboard.writeText(md_tb).then(() => {
                            YqMessage.success({
                                message: "Markdown 已复制到剪贴板",
                                labelDict: {
                                    "zh-CN": { message: "Markdown 已复制到剪贴板" },
                                    "en": { message: "Markdown copied to clipboard" },
                                },
                            });
                        }).catch(() => {
                            YqMessage.error({
                                message: "复制失败",
                                labelDict: {
                                    "zh-CN": { message: "复制失败" },
                                    "en": { message: "Copy failed" },
                                },
                            });
                        });

                        // 创建下载链接
                        const blob = new Blob([md_tb], { type: 'text/markdown;charset=utf-8' });
                        const url = window.URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = tb_row.value.name + ".md";
                        document.body.appendChild(link);
                        link.click();
                        // 清理
                        document.body.removeChild(link);
                        window.URL.revokeObjectURL(url);
                    }

                    const field_editLinks = ref([{
                        name: 'markdown',
                        label: 'markdown导出',
                        toptip: 'markdown导出',
                        icon: 'fa fa-file-code-o',
                        type: "primary",
                        divided: false,
                        disabled: (() => {
                            return false;
                        }),
                        click: (e) => {
                            field_markdown();
                        }
                    }]);

                    const fieldAfterSetTitles = async () => {
                        await tbuiRef.value.initTitles();
                    };

                    const fieldAfterSetData = async () => {
                        await tbuiRef.value.loadData();
                    };

                    let editKey = -1;
                    let titles = [];
                    // 处理行点击
                    const handleRowClick = ({ row, index, key }) => {
                        if (row) {
                            editKey = key;
                            const ui_mask = (typeof row.ui_mask == 'string' ? JSON.parse(row.ui_mask) : row.ui_mask);
                            //console.log('handleRowClick', ui_mask);

                            editUiType.value = row.ui_type;
                            editIsEdit.value = true;
                            editUiMask.value = ui_mask;
                        } else {
                            editKey = -1;
                            editUiType.value = 1;
                            editUiMask.value = {};
                            editIsEdit.value = false;
                        }
                    }

                    // 处理单元格更新
                    const handleUpdateCell = ({ value, row, column }) => {
                        if (column.name == 'ui_type') {
                            if (value != editUiType.value) {
                                editUiType.value = value;
                                editUiMask.value = {};
                            }
                        }
                    }

                    // 处理行更新
                    const handleUpdateRows = (value) => {
                        titles = value;
                        //console.log('handleUpdateRows', value);
                    }

                    // 更新编辑UI掩码
                    const updateEditUiMask = (value) => {
                        //console.log('updateEditUiMask', value);
                        fieldRef.value.updateCellContent({
                            key: editKey,
                            name: 'ui_mask',
                            value: JSON.stringify(value),
                        });
                    }

                    const activeTab = ref('template');

                    const tabLabelDict = ref({
                        "zh-CN": {
                            template: "模板",
                            link: "关联设置",
                        },
                        "en": {
                            template: "Template",
                            link: "Link Settings",
                        },
                    });

                    let loadFkData = false;
                    // 处理tab点击
                    const tabsClick = (tab) => {
                        //console.log('tabsClick', tab, tab.props.name);
                        activeTab.value = tab.props.name;
                        if (tab.props.name == 'link' && !loadFkData) {
                            loadFkData = true;
                            tbfkRef.value.initTitles();
                        }
                    }

                    //-------------------------
                    //tbui
                    let modelTitles = [];
                    let selectModelRow = null;
                    let selectModelKey = -1;
                    const tbuiAfterSetTitles = async () => {
                        await fieldRef.value.loadData();
                        modelTitles = [...tbuiRef.value.titles()];
                        console.log('modelTitles', modelTitles);
                        const typeTitle = modelTitles.find(item => item.name == 'type');
                        typeTitle.ui_readonly = true;
                    };

                    const tbuiRowClick = ({ row, index, key }) => {
                        if (!row) {
                            selectModelRow = null;
                            selectModelKey = -1;
                            modelBtnEnable.value = {
                                copy: false,
                                table: true,
                                html: true,
                                code: true,
                                upp: false,
                                del: false
                            };
                        } else {
                            selectModelRow = row;
                            selectModelKey = key;
                            modelBtnEnable.value = {
                                copy: true,
                                table: true,
                                html: true,
                                code: true,
                                upp: true,
                                del: true
                            };
                        }
                    }
                    const tbuiRowDblClick = ({ row, index, key }) => {
                        modelBtnActive.value.upp();
                    }

                    const modelBtnEnable = ref({
                        copy: false,
                        table: true,
                        html: true,
                        code: true,
                        upp: false,
                        del: false
                    });

                    const modelBtnActive = ref({
                        copy: () => {
                            if (!selectModelRow) {
                                return;
                            }
                            let _row = {
                                ...selectModelRow,
                                no: nextModelNo(),
                            };
                            delete _row['sid'];
                            tbuiRef.value?.saveData([{ action: 'add', row: _row }]);
                        },
                        table: () => {
                            tableOpen('add');
                        },
                        html: () => {
                            htmlOpen('add');
                        },
                        code: () => {
                            codeOpen('add');
                        },
                        upp: () => {
                            if (!selectModelRow) {
                                return;
                            }

                            if (selectModelRow.type == 1) {
                                tableOpen('upp');
                            } else if (selectModelRow.type == 2) {
                                htmlOpen('upp');
                            } else if (selectModelRow.type == 3) {
                                codeOpen('upp');
                            }
                        },
                        del: () => {
                            if (!selectModelRow) {
                                return;
                            }
                            tbuiRef.value?.saveData([{ action: 'del', row: { sid: selectModelRow.sid } }]);
                        }
                    });

                    /* ---------------- 模板菜单（YqMenu inline 工具栏 + YqWindowApi popper 右键菜单） ---------------- */
                    /** 当前右键菜单弹层 id（'' 表示未打开） */
                    let tbuiMenuPopperId = '';
                    /** 是否在 iframe 内（弹窗需委托父窗口） */
                    const inIframe = () => !!(window.parent && window.parent !== window);
                    /** 关闭模板右键菜单弹层 */
                    const closeTbuiMenuPopper = () => {
                        if (!tbuiMenuPopperId) return;
                        const id = tbuiMenuPopperId;
                        tbuiMenuPopperId = '';
                        YqWindowApi.close(id, inIframe());
                    };
                    /** 点击弹层以外区域时关闭菜单（modal:false 的 popper 无遮罩，需自行处理） */
                    const onTbuiMenuDocMouseDown = (e) => {
