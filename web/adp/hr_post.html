<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt" cache="true" minute="1440"></uieip>
    <title>数据管理</title>
    <style>
        #app {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; overflow: hidden;display: block;">
    <div id="app" style="padding: 1px 0 0 0; ">
        <yq-data-grid ref="gridRef" v-bind="gridProps"></yq-data-grid>
    </div>
    <script>
        const { ref, onMounted, createApp, nextTick, computed } = Vue;
        const { ElSelect, ElOption } = ElementPlus;
        const { initTheme, YqWindowApi, yqData, YqDataGrid  } = YqwinPlus;
        initTheme();

        let mainParams = {
            dbname: "yqbase",
            post: {
                tbname: "hr_post",
                keyId: "sid",
                bindingKeyId: null,
                bindingValue: null,
                addWhere: "",
                order: "code",
                frozenNum: 2,
                editMode: 3,
                editModeW: 600,
                editModeH: 450,
                editModeNo: 1,
                loadTitles: false,
                loadData: true,
                isPage: true,
                isEdit: true,
                copy: true,
                add: true,
                upp: true,
                del: true,
                isdel: true,
                isdelEdit: true,
                move: false,
                linkField: ["name"],
            }
        };

        window.onload = function () {
            initApp();
        }

        const initApp = () => {
            const app = createApp({
                components: {
                    YqDataGrid
                },
                setup() {
                    const gridRef = ref(null);
                    const dbname = ref(mainParams.dbname);

                    const gridProps = computed(() => ({
                        dbname: dbname.value,
                        ...mainParams.post,
                        menuType: 3,
                    }));

                    onMounted(async () => {
                        const res = await yqData.fileList({});
                        if (res.error == 0 && res.rows.length > 0) {
                            dbname.value = res.rows[0].name;
                            await gridRef.value.initTitles();
                        }
                    });

                    return {
                        gridRef,
                        dbname,
                        gridProps,
                    }
                }
            })
            app.use(ElementPlus);
            app.mount('#app');
        }

        window.YqwinPlus = {
            YqWindowApi: YqWindowApi,
        }
    </script>
</body>

</html>
