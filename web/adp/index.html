<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt" cache="true" minute="1440"></uieip>
  <title>YQWIN-Plus 页面框架组件测试</title>
  <style>
    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>

<body style="display: block; margin: 0; padding: 0;">
  <div id="app">
    <yq-layout-index v-bind="indexProps"></yq-layout-index>
  </div>
  <!-- 使用ES模块 -->
  <script>
    const { ref, onMounted, createApp } = Vue;
    const { initTheme, YqWindowApi, YqLayoutIndex, i18n  } = YqwinPlus;
    initTheme();

    const app = createApp({
      components: {
        YqLayoutIndex,
      },
      setup() {
        const indexProps = ref({
          tag: 'adp',
          appNos: [0, 9],
          defaultUrl: '/adp/desktop.html',
          sidebarWidth: 220,
          logo: {
            text: 'UIEIP System',
            icon: '/icon/远齐.png',
            path: '/'
          },
          breadcrumb: [
            {
              id: 'ai-chat',
              label: 'AI聊天',
              icon: 'fa fa-weixin',
              path: 'blank://adp/ai-chat.html',
              active: true
            }
          ],
          showUserInfo: false,
          isMultiTab: true,
        });

        return {
          indexProps
        };
      }
    })
    app.use(i18n);
    app.use(ElementPlus, {
    });
    app.mount('#app');

    window.app = app;
    // 创建设置YqwinPlus全局对象，以便子项目可以访问
    window.YqwinPlus = {
      YqWindowApi: YqWindowApi,
    };
  </script>
</body>

</html>
