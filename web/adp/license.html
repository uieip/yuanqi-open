<uieip type="page" value="login"></uieip>
<uieip type="reg" value="console,login,session"></uieip>
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt" cache="true" minute="1440"></uieip>
    <uieip type="tmpl" value="model.title"></uieip>
    <style>
        #app {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; overflow: hidden;display: block;">
    <div id="app" style="padding: 1px 0 0 0;">
        <yq-data-grid ref="tbRef" v-bind="tbProps"></yq-data-grid>
    </div>
    <script>
        const { ref, onMounted, createApp, computed, nextTick } = Vue;
        const { initTheme, YqWindowApi, yqData, YqDataPub, YqMessageBox, YqDataGrid  } = YqwinPlus;
        initTheme();

        <uieip type="tmpl" value="model.params"></uieip>

        let mainParams = {
            tb: _tb
        };

        window.onload = function () {
            initApp();
        }

        const initApp = () => {
            const app = createApp({
                components: {
                    YqDataGrid
                },
                setup() {
                    const tbRef = ref(null);
                    const tbProps = computed(() => ({
                        ...mainParams.tb,
                        loadTitles: false,
                        loadData: true,
                        beforeSetTitles: async (titles) => {
                            return Promise.resolve(titles);
                        },
                        afterSetTitles: async () => {
                            //await dRef.value.initTitles();
                        },
                        topnum: 10,
                        editLinks: [
                            {
                                divided: true,
                            },
                            {
                                name: 'delcache',
                                label: '清理登录缓存',
                                toptip: '清理登录缓存',
                                icon: 'fa fa-eraser',
                                type: "primary",
                                divided: false,
                                disabled: (() => {
                                    return false;
                                }),
                                click: async (e) => {
                                    YqMessageBox.confirm({
                                        message: '确定清理应用缓存...',
                                        title: '提示',
                                        type: 'message',
                                        el: e.target,
                                    }).then(async () => {
                                        await yqData.clearCache("license:");
                                    }).catch(() => {
                                        //console.log('用户点击了取消');
                                    });
                                }
                            }

                        ], //右侧附加菜单
                    }));
                   

                    onMounted(async () => {
                        await tbRef.value.initTitles();
                    });

                    return {
                        tbRef,
                        tbProps
                    }
                }
            })
            app.use(ElementPlus);
            app.mount('#app');
        }

        window.YqwinPlus = {
            YqWindowApi: YqWindowApi,
        }
    </script>
</body>

</html>
