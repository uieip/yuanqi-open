<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt" cache="true" minute="1440"></uieip>
    <title>YqResource 测试页面</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body style="padding: 0;margin: 0;">
    <div id="app">
        <yq-resource :is-edit="isEdit"></yq-resource>
    </div>

    <!-- 使用ES模块 -->
    <script>
        const { createApp, onMounted, ref, nextTick } = Vue;
        const { ElSelect, ElOption } = ElementPlus;
        const { initTheme, YqResource  } = YqwinPlus;
        initTheme();

        const app = createApp({
            components: {
                YqResource
            },
            setup() {
                // 基本状态
                const isEdit = ref(true);

                return {
                    isEdit,
                };
            }
        });

        app.use(ElementPlus);

        app.mount('#app');
    </script>
</body>

</html>
