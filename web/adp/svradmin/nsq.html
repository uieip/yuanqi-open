<uieip type="page" value="login"></uieip>
<uieip type="reg" value="console,login,session"></uieip>
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt" cache="true" minute="1440"></uieip>
    <title>nsq admin</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #app {
            height: 100%;
            width: 100%;
        }

        .el-container {
            height: 100%;
        }

        .el-header {
            height: 38px !important;
            padding: 0 !important;

            background-color: var(--yq-bg-sidebar);
            color: var(--yq-text);
            flex-direction: row;
            align-items: baseline;
        }

        .el-header .line {
            display: flex;
            align-items: center;
            padding: 5px 5px 2px 5px;
        }

        .el-switch {
            margin: 0 10px 0 5px;
        }


        .el-switch__label--left {
            margin-right: 4px;
        }

        .el-switch__label--right {
            margin-left: 4px;
        }

        a {
            color: var(--yq-primary-text);
            text-decoration: none;
        }

        .yqtable {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--yq-border);
            font-size: 16px;
            color: var(--yq-text);
            background-color: var(--yq-bg);
        }

        .yqtable th,
        .yqtable td {
            border: 1px solid var(--yq-border);
            padding: 8px 12px;
        }

        .yqtable th {
            background-color: var(--yq-bg-sidebar);
            color: var(--yq-text-strong);
            font-weight: bold;
        }
    </style>
</head>

<body style="display: block; margin: 0; padding: 0; height: 100%;">
    <div id="app">
        <yq-container style="height: 100vh;">
            <yq-con-header style="padding: 0 20px;">
                <div class="line">
                    <template v-for="(item, index) in switchItems" :key="item.value">
                        <span style="padding: 0 5px 0 5px;">{{ item.label }}</span>
                        <el-switch v-model="item.checked" :active-value="true" :inactive-value="false" active-text="on"
                            inactive-text="off" @change="item.change" :disabled="item.disabled()">
                        </el-switch>
                        <span v-if="index < switchItems.length - 1" style="padding: 0 5px 0 5px;">|</span>
                    </template>
                    <div style="margin-left: auto;display: flex;align-items: center;">
                        <yq-button type="primary" @click="resetNsq" label="重置NSQ" :label-dict="{ 'zh-CN': '重置NSQ', 'en': 'Reset NSQ' }"></yq-button>
                        <span style="margin: 0 0 0 20px;" v-cloak>当前状态:</span>
                        <span
                            :style="{margin: '0 5px', 'font-weight': 'bold', color: nsqStatus ? 'var(--yq-success)' : 'var(--yq-danger)' }"
                            v-cloak>
                            {{ nsqStatus? '运行中' : '已停止' }}</span>
                    </div>
                </div>
            </yq-con-header>
            <yq-con-main style="padding: 0;margin:0;overflow: hidden;">
                <yq-tabs v-model="activeTab" :label-dict="tabLabelDict">
                    <yq-tab-pane label="NSQ Admin" name="nsq">
                        <yq-body type="vue" :content="nsqContent"></yq-body>
                    </yq-tab-pane>
                    <yq-tab-pane label="邮箱测试" name="email">
                        <yq-edit ref="emailRef" v-bind="emailEditProps"></yq-edit>
                        <div style="margin: 10px 0 0 350px;">
                            <yq-menu type="inline" :menu-items="emailMenus" :mini="false"></yq-menu>
                        </div>
                    </yq-tab-pane>
                    <yq-tab-pane label="短信测试" name="sms">
                        <yq-edit ref="smsRef" v-bind="smsEditProps"></yq-edit>
                        <div style="margin: 10px 0 0 350px;">
                            <yq-menu type="inline" :menu-items="smsMenus" :mini="false"></yq-menu>
                        </div>
                    </yq-tab-pane>
                    <yq-tab-pane label="访问统计" name="tongji">
                        <yq-edit ref="tongjiRef" v-bind="tongjiEditProps"></yq-edit>
                        <div style="margin: 10px 0 0 350px;">
                            <yq-menu type="inline" :menu-items="tongjiMenus" :mini="false"></yq-menu>
                        </div>
                    </yq-tab-pane>
                </yq-tabs>
            </yq-con-main>
        </yq-container>
    </div>
    <script>
        const { ref, onMounted, createApp, computed, h } = Vue;
        const { ElSwitch } = ElementPlus;
        const { initTheme, YqMessage, YqMenu, yqData, YqEdit, YqBody, YqWindowApi, YqMessageBox, yqUiPub, YqTabs, YqTabPane, YqButton, YqContainer, YqConHeader, YqConMain  } = YqwinPlus;
        initTheme();

        const app = createApp({
            components: {
                YqMenu,
                YqEdit,
                YqBody,
                YqTabs,
                YqTabPane,
                YqButton,
                YqContainer,
                YqConHeader,
                YqConMain
            },
            setup() {
                const formatDuration = (timestamp) => {
                    const now = Math.floor(Date.now() / 1000);
                    const diff = now - parseInt(timestamp);

                    if (diff < 0) return '0s';

                    const hours = Math.floor(diff / 3600);
                    const minutes = Math.floor((diff % 3600) / 60);
                    const seconds = diff % 60;

                    let result = '';
                    if (hours > 0) result += hours + 'h';
                    if (minutes > 0) result += minutes + 'm';
                    if (seconds > 0 || result === '') result += seconds + 's';

                    return result;
                };

                const status = async () => {
                    var formData = new FormData();
                    formData.append("action", "nsq:ping");
                    const res = await yqData.post("/_svradmin.html", formData);
                    console.log("nsq_status", res);
                    if (res.error === 0) {
                        nsqStatus.value = (res.status === "active");
                        switchItems.value[0].checked = res.email;
                        switchItems.value[1].checked = res.sms;
                        switchItems.value[2].checked = res.tongji;
                        if (nsqStatus.value) {
                            await nsqInfo();
                        }
                    } else {
                        YqMessage.error(res.info + '[' + res.error + ']');
                    }
                }

                const nsqInfo = async () => {
                    var formData = new FormData();
                    formData.append("action", "nsq:info");
                    const res = await yqData.post("/_svradmin.html", formData);
                    console.log("nsq_info", res);
                    if (res.error === 0) {
                        nsqVersion.value = 'v' + res.version;
                        nsqLookupHost.value = res.lookup_addr;
                    } else {
                        YqMessage.error(res.info + '[' + res.error + ']');
                        nsqVersion.value = '';
                    }
                }

                // 创建主题
                const create_topic = async (topic) => {
                    var formData = new FormData();
                    formData.append("action", "nsq:create_topic");
                    formData.append("topic", topic);
                    try {
                        const res = await yqData.post("/_svradmin.html", formData);
                        console.log("create_topic", res);
                        if (res.error === 0) {
                            YqMessage.success({
                                message: "主题已创建",
                                labelDict: {
                                    "zh-CN": { message: "主题已创建" },
                                    "en": { message: "Topic created" },
                                },
                            });
                            return true;
                        } else {
                            YqMessage.error(res.info + '[' + res.error + ']');
                            return false;
                        }
                    } catch (error) {
                        YqMessage.error(error.message);
                        return false;
                    }
                }

                // 删除主题
                const delete_topic = async (topic, linkTarget) => {
                    await YqMessageBox.confirm({
                        message: '您确定要删除主题 ' + topic + ' ？',
                        title: '确认操作',
                        type: 'warning',
                        el: linkTarget // divTarget 是直接的 DOM 元素，不需要 $el
                    });

                    var formData = new FormData();
                    formData.append("action", "nsq:delete_topic");
                    formData.append("topic", topic);
                    try {
                        const res = await yqData.post("/_svradmin.html", formData);
                        console.log("delete_topic", res);
                        if (res.error === 0) {
                            YqMessage.success({
                                message: "主题已删除",
                                labelDict: {
                                    "zh-CN": { message: "主题已删除" },
                                    "en": { message: "Topic deleted" },
                                },
                            });
                            return true;
                        } else {
                            YqMessage.error(res.info + '[' + res.error + ']');
                            return false;
                        }
                    } catch (error) {
                        YqMessage.error(error.message);
                        return false;
                    }

                }

                // 标记主题生产者为墓碑状态
                // node: NSQd节点地址 <broadcast_address>:<http_port>
                const tombstone_topic = async (topic, node, linkTarget) => {
                    await YqMessageBox.confirm({
                        message: '您确定要 tombstone ' + topic + ' ' + node + ' ？',
                        title: '确认操作',
                        type: 'warning',
                        el: linkTarget // divTarget 是直接的 DOM 元素，不需要 $el
                    })
                    var formData = new FormData();
                    formData.append("action", "nsq:tombstone_topic");
                    formData.append("topic", topic);
                    formData.append("node", node);
                    try {
                        const res = await yqData.post("/_svradmin.html", formData);
                        console.log("tombstone", res);
                        if (res.error === 0) {
                            YqMessage.success({
                                message: "主题已设置为 tombstone",
                                labelDict: {
                                    "zh-CN": { message: "主题已设置为 tombstone" },
                                    "en": { message: "Topic set to tombstone" },
                                },
                            });
                            return true;
                        } else {
                            YqMessage.error(res.info + '[' + res.error + ']');
                            return false;
                        }
                    } catch (error) {
                        YqMessage.error(error.message);
                        return false;
                    }
                }

                // 创建通道
                const create_channel = async (topic, channel) => {
                    var formData = new FormData();
                    formData.append("action", "nsq:create_channel");
                    formData.append("topic", topic);
                    formData.append("channel", channel);
                    try {
                        const res = await yqData.post("/_svradmin.html", formData);
                        console.log("create_channel", res);
                        if (res.error === 0) {
                            YqMessage.success(topic + "通道已创建");
                            return true;
                        } else {
                            YqMessage.error(res.info + '[' + res.error + ']');
                            return false;
                        }
                    } catch (error) {
                        YqMessage.error(error.message);
                        return false;
                    }
                }

                // 删除通道
                const delete_channel = async (topic, channel) => {
                    var formData = new FormData();
                    formData.append("action", "nsq:delete_channel");
                    formData.append("topic", topic);
                    formData.append("channel", channel);
                    try {
                        const res = await yqData.post("/_svradmin.html", formData);
                        console.log("delete_channel", res);
                        if (res.error === 0) {
                            YqMessage.success(topic + "通道已删除");
                            return true;
                        } else {
                            YqMessage.error(res.info + '[' + res.error + ']');
                            return false;
                        }
                    } catch (error) {
                        YqMessage.error(error.message);
                        return false;
                    }
                }

                const topic_action = async (broadcast_address, http_port, topic, action) => {
                    var formData = new FormData();
                    formData.append("action", "nsq:topic_" + action);
                    formData.append("broadcast_address", broadcast_address);
                    formData.append("http_port", http_port);
                    formData.append("topic", topic);

                    try {
                        const res = await yqData.post("/_svradmin.html", formData);
                        console.log("topic_empty", res);
                        if (res.error === 0) {
                            YqMessage.success(topic + " " + action);
                            return true;
                        } else {
                            YqMessage.error(res.info + '[' + res.error + ']');
                            return false;
                        }
                    } catch (error) {
                        YqMessage.error(error.message);
                        return false;
                    }
                }

                const channel_action = async (broadcast_address, http_port, topic, channel, action) => {
                    var formData = new FormData();
                    formData.append("action", "nsq:channel_" + action);
                    formData.append("broadcast_address", broadcast_address);
                    formData.append("http_port", http_port);
                    formData.append("topic", topic);
                    formData.append("channel", channel);

                    try {
                        const res = await yqData.post("/_svradmin.html", formData);
                        if (res.error === 0) {
                            YqMessage.success(channel + " " + action);
                            return true;
                        } else {
                            YqMessage.error(res.info + '[' + res.error + ']');
                            return false;
                        }
                    } catch (error) {
                        YqMessage.error(error.message);
                        return false;
                    }
                }

                // 服务操作函数
                // state: start/stop
                // name: email/sms/tongji
                const stateService = async (state, name) => {
                    var formData = new FormData();
                    formData.append("action", "nsq:" + state);
                    formData.append("name", name);
                    const res = await yqData.post("/_svradmin.html", formData);
                    console.log("nsq_status", res);
                    if (res.error === 0) {
                        YqMessage.success(name + "服务已" + (state === 'start' ? '启动' : '停止'));
                    } else {
                        YqMessage.error(res.info + '[' + res.error + ']');
                        switch (name) {
                            case 'email':
                                switchItems.value[0].checked = (state === 'start' ? false : true);
                                break;
                            case 'sms':
                                switchItems.value[1].checked = (state === 'start' ? false : true);
                                break;
                            case 'tongji':
                                switchItems.value[2].checked = (state === 'start' ? false : true);
                                break;
                        }

                    }
                }

                // 发送邮件
                const send_email = async (to, subject, body) => {
                    var formData = new FormData();
                    formData.append("action", "nsq:sendemail");
                    formData.append("to", JSON.stringify(to.split(",")));
                    formData.append("subject", subject);
                    formData.append("body", body);
                    const res = await yqData.post("/_svradmin.html", formData);
                    console.log("nsq_status", res);
                    if (res.error === 0) {
                        YqMessage.success({
                            message: "邮件已发送",
                            labelDict: {
                                "zh-CN": { message: "邮件已发送" },
                                "en": { message: "Email sent" },
                            },
                        });
                    } else {
                        YqMessage.error(res.info + '[' + res.error + ']');
                    }
                }

                // 发送短信
                const send_sms = async (provider, phone_to, template_code, template_param) => {
                    var formData = new FormData();
                    formData.append("action", "nsq:sendsms");
                    formData.append("provider", provider);
                    formData.append("phone_numbers", JSON.stringify(phone_to.split(',')));
                    formData.append("template_code", template_code);
                    formData.append("template_param", template_param);
                    const res = await yqData.post("/_svradmin.html", formData);
                    console.log("nsq_status", res);
                    if (res.error === 0) {
                        YqMessage.success({
                            message: "短信已发送",
                            labelDict: {
                                "zh-CN": { message: "短信已发送" },
                                "en": { message: "SMS sent" },
                            },
                        });
                    } else {
                        YqMessage.error(res.info + '[' + res.error + ']');
                    }
                }

                // 提交访问统计
                const send_tongji = async (params) => {
                    const res = await (await fetch("/_svradmin.html?action=nsq:tongji", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(params),
                    })).json();
                    console.log("send_tongji", res);
                    if (res.error === 0) {
                        YqMessage.success({
                            message: "访问统计已提交",
                            labelDict: {
                                "zh-CN": { message: "访问统计已提交" },
                                "en": { message: "Access stats submitted" },
                            },
                        });
                    } else {
                        YqMessage.error(res.info + '[' + res.error + ']');
                    }
                }

                const restartService = async () => {
                    const res = await yqData.post("/_svradmin.html", {
                        action: "nsq:reload",
                    });
                    console.log("nsq_status", res);
                    if (res.error === 0) {
                        YqMessage.success({
                            message: "服务已重启",
                            labelDict: {
                                "zh-CN": { message: "服务已重启" },
                                "en": { message: "Service restarted" },
                            },
                        });
                    } else {
                        YqMessage.error(res.info + '[' + res.error + ']');
                    }
                }

                const nsqStatus = ref(false);
                const nsqVersion = ref('');
                const nsqLookupHost = ref('');
                const switchItems = ref([
                    {
                        value: 'email',
                        label: 'Email',
                        checked: false,
                        disabled: () => {
                            return !nsqStatus.value;
                        },
                        change: async (val) => {
                            await stateService(val ? 'start' : 'stop', 'email');
                        }
                    }, {
                        value: 'sms',
                        label: 'SMS',
                        checked: false,
                        disabled: () => {
                            return !nsqStatus.value;
                        },
                        change: async (val) => {
                            await stateService(val ? 'start' : 'stop', 'sms');
                        }
                    }, {
                        value: 'tongji',
                        label: '访问统计',
                        checked: false,
                        disabled: () => {
                            return !nsqStatus.value;
                        },
                        change: async (val) => {
                            await stateService(val ? 'start' : 'stop', 'tongji');
                        }
                    }
                ]);
                const menuItems = ref([
                    {
                        name: "reload",
                        label: "重启",
                        toptip: "重启",
                        icon: "fa fa-repeat",
                        type: "primary",
                        disabled: () => {
                            return false;
                        },
                        click: async () => {
                            await restartService();
                        }
                    }
                ]);
                const activeTab = ref('nsq');

                const tabLabelDict = ref({
                    "zh-CN": {
                        "nsq": "NSQ Admin",
                        "email": "邮箱测试",
                        "sms": "短信测试",
                        "tongji": "访问统计",
                    },
                    "en": {
                        "nsq": "NSQ Admin",
                        "email": "Email Test",
                        "sms": "SMS Test",
                        "tongji": "Visit Statistics",
                    },
                });

                // Streams /Topic / Channel
                // Nodes / Topics

                const nsqContent_info = ref(h("div", null, ''));

                // 当前选中的顶部导航
                const activeNav = ref('Streams');

                const navLinkStyle = (name) => ({
                    color: activeNav.value === name
                        ? "var(--el-color-primary)"
                        : "var(--yq-text-muted)",
                    fontWeight: activeNav.value === name ? "bold" : "normal",
                    borderBottom: activeNav.value === name
                        ? "2px solid var(--el-color-primary)"
                        : "2px solid transparent",
                    paddingBottom: "2px",
                    cursor: "pointer",
                    transition: "all 0.2s",
                });

                const nsqErrorMsg = (msg) => {
                    return h("div", {
                        style: {
                            color: "var(--el-color-danger)",
                            backgroundColor: "var(--el-color-danger-light-9)",
                            borderColor: "var(--el-color-danger-light-7)",
                            padding: "15px",
                            margin: "20px 15px",
                            border: "1px solid transparent",
                            borderRadius: "4px",
                            fontSize: "16px",
                            fontWeight: "bold",
                        }
                    }, [
                        h("h2", {
                            style: {
                                fontSize: "20px",
                                fontWeight: "bold",
                            }
                        }, "Notice"),
                        h("br", null, ''),
                        h("span", null, msg),
                    ]);
                }

                /*
                 查找所有主题 nsq:topics
                */
                const nsqStreams = async () => {
                    activeNav.value = 'Streams';
                    let streams = [];
                    var formData = new FormData();
                    formData.append("action", "nsq:topics");
                    const res = await yqData.post("/_svradmin.html", formData);
                    console.log("nsqStreams", res);
                    if (res.error !== 0) {
                        nsqContent_info.value = [
                            h("div", {
                                style: {
                                    margin: "15px 0 0 15px",
                                    fontSize: "30px",
                                    fontWeight: "bold",
                                }
                            }, "Topics"),
                            nsqErrorMsg(res.info),
                        ]
                        return;
                    }

                    if (res.error == 0) {
                        for (var i = 0; i < res.topics.length; i++) {
                            var topic = res.topics[i].topic;
                            streams.push(topic);
                        }
                    }

                    nsqContent_info.value = [
                        h("h1", {
                            style: {
                                fontSize: "25px",
                                fontWeight: "bold",
                                padding: "15px 0 0 10px",
                            }
                        }, "Topics"),
                        h("ul", {
                            style: {
                                padding: "15px",
                                display: "flow",
                                alignItems: "center",
                                gap: "10px",
                                'list-style-type': 'none',
                                fontSize: "16px",
                            }
                        }, [
                            h("li", null, h("div", {
                                style: {
                                    fontSize: "16px",
                                    fontWeight: "bold",
                                    padding: "5px 0",
                                }
                            }, `Topics(${res.topics.length})`)),
                            ...streams.map((stream) => h("li", null, h("a", {
                                href: "javascript:void(0);",
                                onClick: () => nsqLookup(stream)
                            }, stream))),
                        ])
                    ]
                }

                /*
                 查找主题的生产者 nsq:lookup   
                */
                const nsqLookup = async (topic) => {
                    //YqMessage.success(topic + "已执行");

                    var formData = new FormData();
                    formData.append("action", "nsq:lookup");
                    formData.append("topic", topic);
                    const res = await yqData.post("/_svradmin.html", formData);
                    console.log("nsq:lookup", res);

                    let producers = [];
                    let producerTotal = {
                        depth: 0,
                        messages: 0,
                        channels: 0,
                        memory: 0,
                        disk: 0,
                    };
                    let channels = [];

                    const title_h = [h("div", {
                        style: {
                            display: "flex",
                            alignItems: "center",
                            gap: "10px",
                            backgroundColor: "var(--yq-bg-hover)",
                            marginTop: "15px",
                            padding: "8px 13px",
                        }
                    }, [
                        h("a", {
                            href: "javascript:void(0);",
                            onClick: () => nsqStreams()
                        }, "Streams"),
                        h("span", null, "/"),
                        h("span", null, topic)]),
                    h("div", {
                        style: {
                            display: "flex",
                            alignItems: "center",
                            gap: "10px",
                            padding: "10px 20px",
                            margin: "15px 0 20px",
                            fontSize: "17.5px",
                            borderLeft: "5px solid var(--yq-border)",
                        }
                    },
                        h("span", {
                            fontSize: "16px",
                        }, "Topic:"),
                        h("span", {
                            style: {
                                fontSize: "16px",
                                fontWeight: "bold",
                            }
                        }, topic))];

                    if (res.error === 0 && res.producers.length > 0) {
                        for (let i = 0; i < res.producers.length; i++) {
                            let producer = res.producers[i];

                            producers.push({
                                host: producer.hostname + ":" + producer.http_port,
                                ip: producer.broadcast_address + ":" + producer.http_port,
                                depth: producer.depth,
                                memory: (producer.e2e_processing_latency.percentiles ? producer.e2e_processing_latency.percentiles : 0),
                                disk: producer.e2e_processing_latency.count,
                                messages: producer.message_count,
                                channels: producer.channels.length,

                        type: "primary",
                        disabled: () => {
                            return !switchItems.value[2].checked;

                            if (tongjiRef.value.error()) {
                                YqMessage.error({
                                    message: "请填写完整信息",
                                    labelDict: {
                                        "zh-CN": { message: "请填写完整信息" },
                                        "en": { message: "请填写完整信息" },
                                    },
                                });
                                return;
                            }

                            localStorage.setItem('nsq:tongji_test', JSON.stringify(tongjiRow));
                            let row = { ...tongjiRow, "action": tongjiRow.action };
                            await send_tongji(row);

                const onLoad = async () => {
                    await status();
                    await nsqStreams();

                const resetNsq = async () => {
                    var formData = new FormData();
                    formData.append("action", "nsq:reset");
                    try {
                        const res = await yqData.post("/_svradmin.html", formData);
                        console.log("resetNsq", res);
                        if (res.error === 0) {
                            await onLoad();
                            YqMessage.success({
                                message: "重置NSQ成功",
                                labelDict: {
                                    "zh-CN": { message: "重置NSQ成功" },
                                    "en": { message: "重置NSQ成功" },
                                },
                            });
                        } else {
                            YqMessage.error(res.info + '[' + res.error + ']');

                        }
                    } catch (error) {
                        YqMessage.error(error.message);
                    }
                }
                onMounted(async () => {
                    await onLoad();
                })

                return {
                    resetNsq,
                    nsqStatus,
                    menuItems,
                    switchItems,
                    activeTab,
                    tabLabelDict,

                    nsqContent,

                    emailRef,
                    emailEditProps,
                    emailMenus,

                    smsRef,
                    smsEditProps,
                    smsMenus,

                    tongjiRef,
                    tongjiEditProps,
                    tongjiMenus,
                };
            }
        })
        app.use(ElementPlus);
        app.mount('#app');

        window.app = app;
        window.YqwinPlus = {
