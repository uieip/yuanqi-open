<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt" cache="true" minute="1440"></uieip>
    <title>数据编辑</title>
    <style>
        /* 全局重置：消除默认边距，统一盒模型 */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            /* 使用页面底色（深于面板），衬托表单卡片边际 */
            background-color: var(--yq-bg-body);
            color: var(--yq-text);
        }

        #app {
            width: 100vw;
            height: 100vh;
            padding: 8px;
        }

        .yq-edit-container {
            margin: 8px 0;
        }
    </style>

</head>

<body>
    <div id="app">
        <yq-menu v-bind="menuProps"></yq-menu>
        <div class="yq-edit-container">
            <yq-edit ref="formEditRef" v-bind="formProps"></yq-edit>
        </div>
        <yq-menu v-bind="menuProps"></yq-menu>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;
        const { ElMessage } = YqwinPlus;
        const { initTheme, YqEdit, YqWindowApi, YqMenu } = YqwinPlus;
        initTheme();

        window.onload = async function () {
           await initApp();
        }

       async function initApp() {
            // 获取编辑弹窗参数
            const params = await YqWindowApi.getEditParams();

            // 直接打开（非弹窗上下文）时缺少父页注入的 save 等参数，无法编辑
            if (typeof params.save !== 'function') {
                document.getElementById('app').innerHTML = '<div style="padding:20px;color:var(--yq-text);">页面参数缺失，请从列表页打开</div>';
                return;
            }

            console.log("params:", params);

            const app = createApp({
                components: {
                    'yq-edit': YqEdit,
                    'yq-menu': YqMenu
                },
                setup() {
                    const formEditRef = ref(null);
                    const isEdit = ref(params.isEdit ?? true);
                    const row = ref(params.row || {});
                    const keyId = ref(params.keyId || 'sid');
                    const rowKey = ref(params.rowId || null);
                    const fkrows = ref(params.row?.fkrows || []);

                    // yq-edit 绑定参数（v-bind 模式）
                    const formProps = computed(() => ({
                        isView: false,
                        titles: params.titles || [],
                        model: params.model || '',
                        row: row.value,

                        isEdit: isEdit.value,
                        fkrows: fkrows.value,

                        rowKey: rowKey.value,
                        dbName: params.dbName || '',
                        tbName: params.tbName || '',

                        loadDefault: false, //加载默认值
                        blankTag: params.blankTag || '*',     //值不能为空，标题附加标记
                        'onUpdate:row': (newRow) => {
                            row.value = newRow;
                        },
                        'onUpdate:fkrows': (newFkrows) => {
                            fkrows.value = newFkrows;
                        },
                    }));

                    async function saveData() {
                        if (params.checkBlank && formEditRef.value.error()) {
                            ElMessage({
                                message: '请填写完整信息',
                                type: 'error'
                            })
                            return;
                        }

                        const rowData = formEditRef.value.getRow()
                        const res = await params.save([{
                            action: params.action,
                            row: rowData
                        }])

                        // 父页已关窗，上下文失效，直接退出
                        if (res.close) {
                            return;
                        }

                        if (res.msg_error) {
                            ElMessage.error(res.msg_error);
                        } else {
                            // 新增成功后转为更新，回写主键，支持连续编辑
                            if (res.rows.length > 0 && res.rows[0]) {
                                rowKey.value = res.rows[0][keyId.value] || rowKey.value;
                                if (rowKey.value) {
                                    params.action = "upp";
                                    rowData[keyId.value] = rowKey.value;
                                }
                                row.value = rowData;
                            }
                        }

                        if (res.msg_success) {
                            ElMessage({
                                message: res.msg_success,
                                type: 'success'
                            });
                        }
                    }

                    const menuProps = ref({
                        type: 'inline',
                        mini: false,
                        menuItems: [
                            {
                                name: "save",
                                label: "保存",
                                toptip: "保存",
                                icon: "fa fa-save",
                                type: "primary",
                                disabled: () => {
                                    return !isEdit.value
                                },
                                click: async (event) => {
                                    await saveData()
                                }
                            }
                        ]
                    });
                    return {
                        formEditRef,
                        formProps,
                        menuProps,
                    }
                },
            })
            app.use(ElementPlus)
            app.mount('#app')
        }
    </script>
</body>

</html>
