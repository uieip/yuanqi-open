                        // 递归处理子标题
                        const defaultTitles = (_titles, _trans) => {
                            let _json = [];

                            for (let i = 0; i < _titles?.length || 0; i++) {
                                const row = _titles[i];

                                // 解析ui_mask
                                let tmp = row.ui_mask || {};
                                if (typeof tmp === 'string') {
                                    try {
                                        tmp = JSON.parse(tmp);
                                    } catch (error) {
                                        console.log(error);
                                    }
                                }

                                let ui_type = row.ui_type || 1;
                                let ui_mask = {
                                    placeholder: tmp.placeholder || null,
                                    group: null,
                                };

                                switch (ui_type) {
                                    case 6:
                                        ui_mask.lists = tmp.lists || [];
                                        break;
                                    case 8:
                                        if (tmp.level === 1) {
                                            ui_mask.trees = tmp.trees || [];
                                        } else {
                                            ui_type = 1;
                                        }

                                    case 15:
                                    case 16:
                                    case 17:

                                        let subTrans = [];
                                        const transItem = _trans?.find((item) => item.name == row.name);
                                        if (transItem != null) {
                                            subTrans = transItem.ui_mask?.param || [];
                                        }
                                        ui_mask.param = defaultTitles(subTitles, subTrans);

                                        break;

                                    default:
                                        break;
                                }

                                let title = {
                                    name: row.name,
                                    ui_type: ui_type,
                                    ui_title: row.ui_title || row.name,
                                    ui_mask: ui_mask
                                }

                                if (_trans?.length > 0) {
                                    const transItem = _trans?.find((item) => item.name == row.name);
                                    if (transItem != null) {
                                        title.ui_title = transItem.ui_title;
                                        title.ui_mask.placeholder = transItem.ui_mask?.placeholder || null;
                                        title.ui_mask.group = transItem.ui_mask?.group || null;

                                        switch (title.ui_type) {
                                            case 6:
                                                for (let j = 0; j < title.ui_mask.lists?.length || 0; j++) {
                                                    const item = (transItem.ui_mask?.lists || []).find((s) => s.no == title.ui_mask.lists[j].no);
                                                    if (item != null) {
                                                        title.ui_mask.lists[j].name = item.name;
                                                    }
                                                }
                                                break;
                                            case 8:
                                                const replaceitem = (trees, up_trees) => {
                                                    for (let j = 0; j < trees?.length || 0; j++) {
                                                        const item = trees[j];
                                                        const up_item = up_trees.find((s) => s.no == item.no);
                                                        if (up_item != null) {
                                                            item.name = up_item.name;
                                                            if (item.subs?.length > 0 && up_item.subs?.length > 0) {
                                                                replaceitem(item.subs, up_item.subs);
                                                            }
                                                        }
                                                    }
                                                }

                                                if (title.ui_mask.trees?.length > 0 && (transItem.ui_mask?.trees || []).length > 0) {
                                                    replaceitem(title.ui_mask.trees, transItem.ui_mask.trees || []);
                                                }
                                                break;
                                            default:
                                                break;
                                        }
                                    }
                                }

                                    delete title.ui_mask.placeholder;
                                }
                                if (title.ui_mask.group === null || title.ui_mask.group === "") {
                                    delete title.ui_mask.group;
                                }

                                _json.push(title);
                            }

                            return _json;

                                    }

                                    if (transRes.trans?.length > 0) {
                                        const transItem = transRes.trans?.find((item) => item.no == row.no);
                                        if (transItem != null) {
                                            app.name = transItem.name;
                                            app.describe = transItem.describe;
                                            app.remark = transItem.remark;
                                        }
                                    }

                                    json.push(app);
                                }

                                break;
                            case 2:
                                let names = mainParams.name.split(":");
                                if (names.length != 2) {
                                    YqMessage.error({
                                        message: "name格式错误",
                                        labelDict: {
                                            "zh-CN": { message: "name格式错误" },
                                            "en": { message: "Invalid name format" },
                                        },
                                    });
                                    return [];
                                }

                                let appno = parseInt(names[1]);
                                let menusRes = await yqData.dbMenus({
                                    appno: appno
                                });
                                if (menusRes.error != 0) {
                                    YqMessage.error(menusRes.msg);
                                    return [];
                                }

                                // 递归获取所有子菜单
                                const rows = []
                                const getsubs = (pid) => {
                                    let subs = [];
                                    for (let i = 0; i < menusRes.rows?.length || 0; i++) {
                                        const row = menusRes.rows[i];
                                        if (pid === null) {
                                            if (row.pid === null || row.pid === undefined) {
                                                rows.push(row);
                                                getsubs(row.sid);
                                            }
                                        } else if (row.pid === pid) {
                                            rows.push(row);
                                            getsubs(row.sid);
                                        }
                                    }
                                }
                                getsubs(null);

                                //console.log("menusRes:", rows);

                                for (let i = 0; i < rows?.length || 0; i++) {
                                    const row = rows[i];
                                    if (!(row.menu_type === 0 || row.menu_type === 1 || row.menu_type === 2)) {
                                        continue;
                                    }

                                    let menu = {
                                        no: row.no,
                                        name: row.name,
                                        describe: row.describe,
                                        remark: row.remark,
                                    }

                                    if (transRes.trans?.length > 0) {
                                        const transItem = transRes.trans?.find((item) => item.no == row.no);
                                        if (transItem != null) {
                                            menu.name = transItem.name;
                                            menu.describe = transItem.describe;
                                            menu.remark = transItem.remark;
                                        }
                                    }

                                    json.push(menu);
                                }

                                break;
                            case 3:
                                let titlesRes = await yqData.tbTitle({
                                    dbname: mainParams.dbname,
                                    tbname: mainParams.name,
                                    tempno: '-1',
                                });

                                console.log("titlesRes:", titlesRes);
                                if (titlesRes.error != 0) {
                                    YqMessage.error(titlesRes.msg);
                                    return [];
                                }

                                json = defaultTitles(titlesRes.titles, transRes.trans);

                                console.log("json:", json);

                                break;

                            case 4:
                            case 9:
                                const paramsRes = await yqData.params({
                                    type: mainParams.type,
                                    name: mainParams.name
                                });
                                console.log("paramsRes:", paramsRes);
                                if (paramsRes.error != 0) {
                                    YqMessage.error(paramsRes.info);
                                    return [];
                                }

                                for (let j = 0; j < paramsRes.params?.length || 0; j++) {
                                    const row = paramsRes.params[j];
                                    if (transRes.trans?.length > 0) {
                                        const transItem = transRes.trans?.find((item) => item.code == row.code);
                                        if (transItem != null) {
                                            if (!(transItem.name === null || transItem.name === "")) {
                                                row.name = transItem.name;
                                            }
                                            if (!(transItem.describe === null || transItem.describe === "")) {
                                                row.describe = transItem.describe;
                                            }
                                        }
                                    }

                                    json.push(row);
                                }

                                break;

                            default:
                        }

                        if (transRes.trans?.length > 0) {
                            hasRow = true;
                        }

                        //console.log("json:", json);

                        let numRes = await yqData.transNumber({
                            dbname: mainParams.dbname,
                            type: row.value.type,
                            name: row.value.name
                        });
                        if (numRes.error != 0) {
                            YqMessage.error(numRes.msg);
                            return [];
                        }

                        //console.log("numRes:", JSON.stringify(numRes, null, 2));
                        clearEnabled.value = hasRow;
                        clearAllEnabled.value = numRes.num > 0;
                        saveEnabled.value = true;

                        return json;
                    }

                    const formProps = computed(() => {
                        return {
                            titles: titles.value,
                            model: model.value,
                            row: row.value,
                            isEdit: true,
                            "onUpdate:row": (newRow) => {
                                row.value = newRow;
                            },
                            "onUpdate:value": ({ name, value }) => {
                                if (name == "lang") {
                                    loadTransData();
                                }
                            }
                        }
                    })

                    const menuRef = ref(null);
                    const menuProps = ref({
                        type: 'inline',
                        menuItems: [
                            {
                                name: "save",
                                label: "save",
                                toptip: "save",
                                icon: "fa fa-save",
                                type: "primary",
                                disabled: () => {
                                    return !saveEnabled.value
                                },
                                click: async () => {
                                    EditDisabled();
                                    let transRes = await yqData.transSave({
                                        dbname: mainParams.dbname,
                                        type: row.value.type,
                                        lang: row.value.lang,
                                        name: row.value.name,
                                        json: JSON.stringify(row.value.json),
                                    });
                                    if (transRes.error != 0) {
                                        YqMessage.error(transRes.msg);
                                        return;
                                    }
                                    YqMessage.success({
                                        message: "save success",
                                        labelDict: {
                                            "zh-CN": { message: "保存成功" },
                                            "en": { message: "Save success" },
                                        },
                                    });
                                    await loadTransData();
                                }
                            }, {
                                divided: true
                            }, {
                                name: "clear",
                                label: "clear",
                                toptip: "clear",
                                icon: "fa fa-times",
                                type: "primary",
                                disabled: () => {
                                    return !clearEnabled.value
                                },
                                click: async () => {
                                    try {
                                        await YqMessageBox.confirm({
                                            el: event.target,
                                            top: 35,
                                            message: '您确定要清空所有翻译吗？',
                                            title: '确认操作',
                                            type: 'warning',
                                            labelDict: {
                                                "en": {
                                                    title: 'Confirm Clear',
                                                    message: 'Are you sure you want to clear translations?',
                                                    cancelButtonText: 'Cancel',
                                                    confirmButtonText: 'Confirm'
                                                }
                                            }
                                        });
                                        EditDisabled();
                                        let transRes = await yqData.transClear({
                                            dbname: mainParams.dbname,
                                            type: row.value.type,
                                            lang: row.value.lang,
                                            name: row.value.name
                                        });
                                        if (transRes.error != 0) {
                                            YqMessage.error(transRes.info);
                                        } else {
                                            YqMessage.success({
                                                message: "clear success",
                                                labelDict: {
                                                    "zh-CN": { message: "清理成功" },
                                                    "en": { message: "Clear success" },
                                                },
                                            });

                                            if (parentParams.reload) {
                                                await parentParams.reload();
                                                YqWindowApi.close(frameId, isParent);
                                                return;
                                            }
                                        }
                                        await loadTransData();
                                    }
                                    catch (ex) { }
                                }
                            }, {
                                divided: true
                            }, {
                                name: "clearall",
                                label: "clear all",
                                toptip: "clear all",
                                icon: "fa fa-trash",
                                type: "primary",
                                disabled: () => {
                                    return !clearAllEnabled.value
                                },
                                click: async (event) => {
                                    try {
                                        await YqMessageBox.confirm({
                                            el: event.target,
                                            top: 35,
                                            message: '您确定要清空所有翻译吗？',
                                            title: '确认操作',
                                            type: 'warning',
                                            labelDict: {
                                                "en": {
                                                    title: 'Confirm Clear All',
                                                    message: 'Are you sure you want to clear all translations?',
                                                    cancelButtonText: 'Cancel',
                                                    confirmButtonText: 'Confirm'
                                                }
                                            }
                                        });

                                        EditDisabled();
                                        let transRes = await yqData.transClearAll({
                                            dbname: mainParams.dbname,
                                            type: row.value.type,
                                            name: row.value.name
                                        });
                                        if (transRes.error != 0) {
                                            YqMessage.error(transRes.info);
                                        } else {
                                            YqMessage.success({
                                                message: "clearAll success",
                                                labelDict: {
                                                    "zh-CN": { message: "全部清理成功" },
                                                    "en": { message: "Clear all success" },
                                                },
                                            });

                                            if (parentParams.reload) {
                                                await parentParams.reload();
                                                YqWindowApi.close(frameId, isParent);
                                                return;
                                            }
                                        }
                                        await loadTransData();
                                    }
                                    catch (ex) { }
                                }
                            }
                        ],
                        mini: false,
                    });
                    const menuTrans = ref({
                        "save": {
                            "zh-CN": {
                                "label": "保存",
                                "toptip": "保存"
                            },

                            "en": {
                                "label": "save",
                                "toptip": "save"
                            }
                        },
                        "clear":
                        {
                            "zh-CN": {
                                "label": "清空",
                                "toptip": "清空"
                            },
                            "en": {
                                "label": "clear",
                                "toptip": "clear"
                            }
                        },
                        "clearall":
                        {
                            "zh-CN": {
                                "label": "清空所有",
                                "toptip": "清空所有"
                            },
                            "en": {
                                "label": "clearall",
                                "toptip": "clearall"
                            }
                        },
                    });

                    const EditDisabled = () => {
                        saveEnabled.value = false;
                        clearEnabled.value = false;
                        clearAllEnabled.value = false;
                    };

                    // 加载翻译数据
                    const loadTransData = async () => {
                        EditDisabled();

                        const jsonData = await getDefaultValue();

                        editRef.value.setRow({
                            row: {
                                ...row.value,
                                json: jsonData,
                            },
                        });
                    }

                    onMounted(async () => {
                        const opts = {
                            dbname: mainParams.dbname,
                            tbname: "sys_trans",
                            tempno: -1
                        };

                        let res = await yqData.tbTitle(opts, false);
                        if (res.error != 0) {
                            YqMessage.error(res.msg);
                            return;
                        }
                        //console.log("titles:", JSON.stringify(res.titles, null, 2));

                        const tmp_titles = [...res.titles];
                        for (let i = 0; i < tmp_titles.length; i++) {
                            if (tmp_titles[i].name == "json") {
                                tmp_titles[i] = getJsonTitles.value;
                                break;
                            }
                        }

                        titles.value = await yqUiPub.formatUiTitles(tmp_titles, "");;

                        console.log("titles.value:", titles.value);

                        await loadTransData();
                    });

                    return {
                        editRef,
                        formProps,
                        menuRef,
                        menuProps,
                        menuTrans,
                    }
                }
            })
            app.use(ElementPlus, {

            });
            app.mount('#app');
        }

        window.YqwinPlus = {
            YqWindowApi: YqWindowApi,
        }
    </script>
</body>

</html>
