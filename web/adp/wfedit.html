<uieip type="reg" value="console,login,session"></uieip>
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt" cache="true" minute="1440"></uieip>
    <title>流程管理</title> 
    <style>
        #app {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; overflow: hidden;display: block;">
    <div id="app">
        <yq-container v-model:aside-width="leftW" style="height: 100%;padding-top: 1px;">
            <yq-con-aside>
                <div style="margin:0; height: 60%;">
                    <yq-data-tree ref="mainRef" v-bind="mainProps"></yq-data-tree>
                </div>
                <div ref="verDiv" style=" padding: 4px 0 0 0;margin:0; height: 40%;">
                    <yq-data-grid ref="verRef" v-bind="verProps"></yq-data-grid>
                </div>
            </yq-con-aside>

            <yq-con-main style="padding:0 0 0 3px;">
                <yq-flow-edit ref="wfRef" v-bind="wfProps"></yq-flow-edit>
            </yq-con-main>
        </yq-container>
    </div>
    <script>
        const { ref, onMounted, createApp, nextTick, computed } = Vue;
        const { ElSelect, ElOption } = ElementPlus;
        const { initTheme, YqWindowApi, yqData, YqDataTree, YqDataGrid, YqFlowEdit, YqContainer, YqConAside, YqConMain  } = YqwinPlus;
        initTheme();

        let mainParams = {
            dbname: "yqbase",
            leftW: 310,
            main: {
                tbname: "sys_wfmain",
                keyId: "sid",
                bindingKeyId: null,
                bindingValue: null,
                pKeyId: "pid",
                pKeyValue: null,

                loadDataType: 2,
                displayMember: "name",
                loadData: false,

                menuType: 3,

                overflowY: true,

                editMode: 2,
                editModeW: 600,
                editModeH: 450,
                editModeNo: -1,
            },
            ver: {
                tbname: "sys_wfver",
                keyId: "sid",
                bindingKeyId: "mainid",
                bindingValue: null,

                addWhere: "",
                order: "queue",

                editMode: 3,
                editModeW: 600,
                editModeH: 450,
                editModeNo: 1,
                loadTitles: false,
                loadData: false,
                isPage: false,

                isEdit: true,
                copy: true,
                add: true,
                upp: false,
                del: true,
                isdel: false,
                isdelEdit: false,
                move: true,

                editLoadData: true,

                isSimple: false,
                isSeek: false,

            }
        };

        window.onload = function () {
            mainParams.leftW = window.innerWidth * 0.20;
            if (mainParams.leftW < 310) {
                mainParams.leftW = 310;
            }
            initApp();
        }

        const initApp = () => {
            const app = createApp({
                components: {
                    YqDataTree,
                    YqDataGrid,
                    YqFlowEdit,
                    YqContainer,
                    YqConAside,
                    YqConMain
                },
                setup() {
                    const leftW = ref(mainParams.leftW + 'px');
                    const verDiv = ref(null);
                    const mainRef = ref(null);
                    const verRef = ref(null);
                    const wfRef = ref(null);

                    const mainId = ref(null);
                    const verId = ref(null);
                    let verRow = ref(null);
                    const wfData = ref(null);
                    const mainProps = ref({
                        ...mainParams.main,
                        dbname: mainParams.dbname,
                        afterSetTitles: async () => {
                            await verRef.value.initTitles();
                        },
                        onRowClick: async ({ row, sid }) => {
                            console.log(row, sid);
                            if (row && row.wf_type == 1) {
                                mainId.value = sid;
                            }
                            else {
                                mainId.value = null;
                            }
                            if (mainId.value) {
                                await verRef.value.loadData();
                            } else {
                                await verRef.value.clear();
                            }
                        }
                    });
                    const verProps = ref({
                        ...mainParams.ver,
                        menuType: 3,
                        dbname: mainParams.dbname,
                        bindingKeyId: "mainid",
                        bindingValue: mainId,
                        afterSetTitles: async () => {
                            await mainRef.value.loadData();
                        },
                        onRowClick: async ({ row }) => {
                            if (row) {
                                verId.value = row.sid;
                                verRow.value = row;
                                 
                                // 流程信息处理
                                var _json = {};
                                if (!(row["json"] === undefined)) {
                                    _json = (row["json"] === null ? {} : JSON.parse(row["json"]));
                                    if (_json.info === null || _json.info === undefined) {
                                        _json.info = {};
                                    }
                                    if (_json.node === null || _json.node === undefined) {
                                        _json.node = [];
                                    }
                                    if (_json.link === null || _json.link === undefined) {
                                        _json.link = [];
                                    }

                                    const info_fields = ["ver", "current", "name", "describe", "func", "db_name",
                                        "tb_name", "state_field", "state_func", "state_start", "state_start_name",
                                        "parameter", "case_when", "remark"]
                                    for (var index = 0; index <  info_fields.length; index++) {
                                        var _sval =  info_fields[index];
                                        if (!(row[_sval] === undefined || row[_sval] === null)) {
                                            if (_sval == "parameter") {
                                                _json.info[_sval] = (row[_sval] === null ? null : JSON.parse(row[_sval]));
                                            } else {
                                                _json.info[_sval] = row[_sval];
                                            }
                                        }
                                    }
                                }
                                wfData.value = _json;
                                // -------------
                            }
                            else {
                                verId.value = null;
                                verRow.value = null;
                                wfData.value = {};
                            }
                        }
                    });

                    const wfProps = computed(() => ({
                        verId: verId.value,
                        modelValue: wfData.value || {},
                        mini: true,         // 是否迷你模式
                        isEdit: verId.value ? true : false,
                        onSave: async (event, data) => {
                            const ver_row = { ...verRow.value, ...data.info };
                            if (typeof ver_row["parameter"] == "object") {
                                ver_row["parameter"] = JSON.stringify(ver_row["parameter"]);
                            } else {
                                delete ver_row["parameter"];
                            }
                            delete data.info.parameter
                            ver_row["json"] = JSON.stringify(data);
                            verRef.value.saveData([{ action: "upp", row: ver_row, key: verRow.value["_addKey"] }]);
                        }
                    }));

                    onMounted(async () => {
                        const dbList = await yqData.dbList();
                        if (dbList.error == 0) {
                            mainParams.dbname = dbList.rows[0].name;
                            await mainRef.value.initTitles();
                        } else {
                            console.error(dbList);

                        }
                    });

                    return {
                        leftW,
                        verDiv,
                        mainRef,
                        verRef,
                        wfRef,
                        mainProps,
                        verProps,
                        wfProps,
                    }
                }
            })
            app.use(ElementPlus);
            app.mount('#app');
        }

        window.YqwinPlus = {
            YqWindowApi: YqWindowApi,
        }
    </script>

</body>

</html>
