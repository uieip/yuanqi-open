<script>
    function userlogin() {
        var backurl = window.document.location.href;
        window.top.location = "/login/login.html?backurl=" + encodeURIComponent(backurl);
    }
    function userlogout() {
        var backurl = window.location.protocol + '//' + window.location.host;
        window.top.location = "/login/logout.html?backurl=" + encodeURIComponent(backurl);
    }
    function onresize() {
        document.querySelectorAll(".inner-info").forEach(function(el) {
            el.style.marginBottom = "0px";
        });
        var footEl = document.querySelector(".footer .container");
        if (footEl) {
            var footRect = footEl.getBoundingClientRect();
            var h_ = parseInt(document.documentElement.scrollHeight - (footRect.top + footRect.height));
            if (h_ > 0) {
                var prevEl = footEl.closest(".footer") ? footEl.closest(".footer").previousElementSibling : null;
                if (prevEl) {
                    prevEl.style.marginBottom = h_ + "px";
                }
            }
        }
    }
    window.addEventListener('resize', onresize);
    onresize();
</script>
