        <img src="/images/banner2.png" style="width: 100%; margin-bottom: 15px" />
    </div>
    <div class="container inner-info">
        <div class="row">
            <div class="col-md-4 col-sm-6">
                <div class="card tone-blue">
                    <div class="card-header">
                        <span class="hd-icon"><i class="bi bi-collection-fill"></i></span>
                        开发资源
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="/jsvm/index.html"><i class="bi bi-filetype-js"></i> jsvm test</a></li>
                        <li class="list-group-item"><a href="/login/index.html"><i class="bi bi-box-arrow-in-right"></i> login</a></li>

                        <li class="list-group-item"><a href="/adp/" target="_blank"><i class="bi bi-layers"></i> adp</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <div class="card tone-violet">
                    <div class="card-header">
                        <span class="hd-icon"><i class="bi bi-lightning-charge-fill"></i></span>
                        平台特性
                        <span class="hdr-sub">uieip.com</span>
                    </div>
                    <ul class="list-group list-group-flush">

                    </ul>
                </div>

            <div class="col-md-4 offset-md-0 col-sm-6 offset-sm-3">

    </div>
    <uieip type="file" value="inc" src="/cms/inc/pc_footer_inc.html"></uieip>
    <script>
        function onresize() {
            var innerEl = document.querySelector(".inner-info");
            if (!innerEl) return;
            innerEl.style.marginBottom = "0px";
            var footEl = document.querySelector(".footer .container");
            if (footEl) {
                var h_ = parseInt(document.documentElement.scrollHeight - 25 - innerEl.getBoundingClientRect().top - innerEl.offsetHeight - footEl.offsetHeight);
                if (h_ > 0) {
                    innerEl.style.marginBottom = h_ + "px";
                }
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            window.addEventListener('resize', onresize);
            onresize();
        });
    </script>
</body>
