<!doctype html>
<uieip type="page" value="base"></uieip>
<uieip type="reg" value="console,cms"></uieip>

<html>

<head>
    <uieip type="file" value="inc" src="/cms/inc/pc_head_inc.html"></uieip>
    <script src="/scripts/marked/marked.min.js"></script>
    <title>查询</title>
    <style>
        .ai-result-panel {
            margin-top: 15px;
            background-color: #f5f7fa;
            border-radius: 4px;
            padding: 15px;
            border: 1px solid #ebeef5;
        }

        .ai-chat-response {
            background-color: #f0f9eb;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-left: 3px solid #67c23a;
            border: 1px solid #e1f3d8;
        }

        .ai-result-item {
            background: linear-gradient(135deg, #f8faff 0%, #ffffff 100%);
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
            border-left: 3px solid #e4e7ed;
            border-top: 1px solid #edf0f5;
            border-right: 1px solid #edf0f5;
            border-bottom: 1px solid #edf0f5;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ai-result-item:hover {
            border-left-color: #409eff;
            border-top-color: #d9ecff;
            border-right-color: #d9ecff;
            border-bottom-color: #d9ecff;
            box-shadow: 0 6px 20px rgba(64, 158, 255, 0.12), 0 2px 6px rgba(64, 158, 255, 0.06);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 100%);
        }

        .ai-result-title {
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            line-height: 1.5;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ai-result-link {
            font-size: 12px;
            color: #c0c4cc;
            text-decoration: none;
            white-space: nowrap;
            padding: 2px 8px;
            border-radius: 4px;
            background: transparent;
            transition: all 0.2s ease;
            float: right;
        }

        .ai-result-link:hover {
            color: #fff;
            background: #409eff;
            text-decoration: none;
        }

        .ai-result-content {
            margin: 8px 0 0 0;
            font-size: 13px;
            color: #8e99a4;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ai-loading {
            text-align: center;
            padding: 20px;
            color: #909399;
        }

        .ai-markdown-content h1 { font-size: 24px; font-weight: bold; margin: 0 0 10px 0; color: #303133; }
        .ai-markdown-content h2 { font-size: 20px; font-weight: bold; margin: 0 0 8px 0; color: #303133; }
        .ai-markdown-content h3 { font-size: 18px; font-weight: bold; margin: 0 0 6px 0; color: #303133; }
        .ai-markdown-content p { margin: 0 0 10px 0; line-height: 1.6; }
        .ai-markdown-content ul, .ai-markdown-content ol { margin: 0 0 10px 0; padding-left: 20px; }
        .ai-markdown-content li { margin-bottom: 4px; }
        .ai-markdown-content blockquote { border-left: 4px solid #409eff; padding-left: 10px; color: #909399; margin: 0 0 10px 0; }
        .ai-markdown-content code { background-color: #f5f7fa; padding: 2px 4px; border-radius: 4px; font-size: 12px; }
        .ai-markdown-content pre { background-color: #f5f7fa; padding: 10px; border-radius: 4px; overflow-x: auto; margin: 0 0 10px 0; }
        .ai-markdown-content pre code { padding: 0; }
        .ai-markdown-content a { color: #409eff; text-decoration: none; }
        .ai-markdown-content a:hover { text-decoration: underline; }
        .ai-markdown-content table { width: 100%; border-collapse: collapse; margin: 0 0 10px 0; }
        .ai-markdown-content th, .ai-markdown-content td { border: 1px solid #ebeef5; padding: 6px 10px; text-align: left; }
        .ai-markdown-content th { background-color: #f5f7fa; font-weight: bold; }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="container">
        <uieip type="file" value="exec" src="/cms/inc/pc_topmenu_exec.html"></uieip>
        <uieip type="file" value="exec" src="/cms/inc/pc_breadcrumb_exec.html"></uieip>
        <div class="row">
            <div class="col-md-8 col-sm-7">
                <div class="input-group" style="margin: 5px 0 5px 0px; max-width: 550px;">
                    <input type="text" class="form-control" id="searchInput" placeholder="输入查询内容">
                    <span class="input-group-btn">
                        <button class="btn btn-outline-secondary" type="button" id="searchBtn"><i class="bi bi-search"></i></button>
                    </span>
                </div>
                <div class="checkbox" style="margin-left: 0px; margin-top: 5px;">
                    <label>
                        <input type="checkbox" id="txt_chat" checked> 对话模式
                    </label>
                </div>
                <div id="aiResultPanel" class="ai-result-panel" style="margin-left: 0px; margin-right: 10px; display: none;"></div>
            </div>
            <div class="col-md-4 col-sm-5">
                <div class="listright">
                    <uieip id="div_list" type="tmpl" value="cms.datalist" dbname="yqbase" tbname="cms_news" pageno="1"
                        pagesize="5" where="" order="time desc" js="datalist_js"></uieip>
                </div>
            </div>
        </div>
    </div>

    <uieip type="file" value="inc" src="/cms/inc/pc_footer_inc.html"></uieip>
    <script runat="server">
        function datalist_js(data) {
            var t_url = "/" + data.path + "/";
            var h_ = `<h4 class="listtitle">推荐<a href="` + t_url + `" class="float-end">more</a></h4>`;
            h_ += `<div class="list-group">`;
            for (var i = 0; i < data.rows.length; i++) {
                h_ += `   <a href="/blog/` + data.rows[i].tid + `.html" class="list-group-item list-group-item-action">`;
                h_ += '      <div class="media">';
                h_ += '       <div class="media-body">';
                h_ += '          <h4 class="media-heading">' + data.rows[i].title;
                h_ += '           <small class="float-end" style="padding-top: 5px;">' + data.rows[i].time.substring(0, data.rows[i].time.indexOf(" ")) + '</small>';
                h_ += '        </h4>';
                h_ += '        </div>';
                h_ += '      </div>';
                h_ += `   </a>`;
            }
            h_ += `</div>`;
            return h_;
        }
    </script>
    <script>
        var isQuerying = false;

        document.addEventListener('DOMContentLoaded', function() {
            marked.setOptions({
                breaks: true,
                gfm: true
            });

            document.getElementById('searchBtn').addEventListener('click', doAiQuery);
            document.getElementById('searchInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    doAiQuery();
                }
            });
        });

        async function doAiQuery() {
            if (isQuerying) return;

            var query = document.getElementById('searchInput').value.trim();
            var chat = document.getElementById('txt_chat').checked;
            var searchBtn = document.getElementById('searchBtn');
            var resultPanel = document.getElementById('aiResultPanel');

            if (!query) {
                alert('请输入查询内容');
                return;
            }

            isQuerying = true;
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="bi bi-arrow-clockwise spin"></i>';
            resultPanel.style.display = '';
            resultPanel.innerHTML = '<div class="ai-loading"><i class="bi bi-arrow-clockwise spin"></i> 查询中...</div>';

            try {
                var res = await aiQuery(query, chat);
                renderResult(res);
            } catch (error) {
                resultPanel.innerHTML = '<div class="alert alert-danger">查询失败: ' + escapeHtml(error.message) + '</div>';
            } finally {
                isQuerying = false;
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="bi bi-search"></i>';
                setTimeout(onresize, 100);
            }
        }

        function aiQuery(query, chat) {
            return new Promise(function (resolve, reject) {
                var params = new URLSearchParams({
                    action: 'query',
                    query: query,
                    chat: chat ? 'true' : 'false'
                });
                var controller = new AbortController();
                var timeoutId = setTimeout(function() {
                    controller.abort();
                    reject(new Error('请求超时'));
                }, 30000);

                fetch('/_ai_website.html?' + params.toString(), {
                    method: 'GET',
                    signal: controller.signal
                }).then(function(response) {
                    clearTimeout(timeoutId);
                    if (!response.ok) {
                        reject(new Error('网络错误: ' + response.status));
                    }
                    return response.json();
                }).then(function(data) {
                    if (data.error !== 0) {
                        alert(data.info);
                        resolve({ rows: [], chat: '' });
                    } else {
                        resolve(data);
                    }
                }).catch(function(err) {
                    clearTimeout(timeoutId);
                    if (err.name === 'AbortError') {
                        reject(new Error('请求超时'));
                    } else {
                        reject(err);
                    }
                });
            });
        }

        function renderResult(res) {
            var resultPanel = document.getElementById('aiResultPanel');
            var html = '';

            if (res.chat && res.chat.length > 0) {
                html += '<div class="ai-chat-response"><div class="ai-markdown-content">' + marked.parse(res.chat) + '</div></div>';
            }

            if (res.rows && res.rows.length > 0) {
                res.rows.forEach(function (item) {
                    html += '<div class="ai-result-item">';
                    html += '<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">';
                    html += '<h3 class="ai-result-title">' + escapeHtml(item.name) + '</h3>';
                    if (item.url) {
                        html += '<a href="' + escapeHtml(item.url) + '" target="_blank" class="ai-result-link">详情 →</a>';
                    }
                    html += '</div>';
                    if (item.content) {
                        html += '<p class="ai-result-content">' + escapeHtml(item.content) + '</p>';
                    }
                    html += '</div>';
                });
            } else {
                html += '<div class="alert alert-info">暂无查询结果</div>';
            }

            resultPanel.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }
    </script>
</body>

</html>
