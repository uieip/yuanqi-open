openapi: "3.0.3"
info:
  title: 远齐科技 SSO 单点登录系统
  description: |
    统一身份认证中心，支持 OAuth 2.0、OpenID Connect、CAS 2.0、LDAP 及远齐自研 SSO 协议。
  version: "1.0.0"
  contact:
    name: 远齐科技

servers:
  - url: https://sso.uieip.com
    description: 生产环境
  - url: http://sso.uieip.com
    description: 开发环境

paths:
  # ============================================================
  # OAuth 2.0
  # ============================================================
  /connect/auth/gettoken:
    get:
      summary: 获取 Access Token
      description: 使用 appid + corpsecret 换取 access_token，有效期 7200 秒。
      tags: [OAuth 2.0]
      parameters:
        - name: appid
          in: query
          schema: { type: string }
        - name: corpsecret
          in: query
          schema: { type: string }
        - name: client_id
          in: query
          description: appid 的别名
          schema: { type: string }
        - name: client_secret
          in: query
          description: corpsecret 的别名
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2TokenResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/auth/authorize:
    get:
      summary: 构造网页授权链接
      description: 用户认证入口，成功后回调 redirect_uri 并附带 code 参数。
      tags: [OAuth 2.0]
      parameters:
        - name: appid
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [snsapi_base, snsapi_privateinfo]
        - name: state
          in: query
          schema:
            type: string
            pattern: "^[a-zA-Z0-9]{0,128}$"
        - name: nonce
          in: query
          description: 防重放攻击随机值
          schema: { type: string }
      responses:
        "302":
          description: 重定向到回调地址，附 code 参数
        "400":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/auth/getuserinfo:
    get:
      summary: 获取访问用户身份
      description: 根据 code 获取用户 UserID。
      tags: [OAuth 2.0]
      parameters:
        - name: appid
          in: query
          schema: { type: string }
        - name: client_id
          in: query
          description: appid 的别名
          schema: { type: string }
        - name: access_token
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "400":
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/auth/getuserdetail:
    post:
      summary: 获取用户详细信息
      tags: [OAuth 2.0]
      parameters:
        - name: appid
          in: query
          schema: { type: string }
        - name: client_id
          in: query
          description: appid 的别名
          schema: { type: string }
        - name: access_token
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userid]
              properties:
                userid:
                  type: string
                  description: 用户ID
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "400":
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/auth/logout:
    get:
      summary: OAuth 2.0 单点登出
      tags: [OAuth 2.0]
      parameters:
        - name: appid
          in: query
          schema: { type: string }
        - name: redirect_uri
          in: query
          schema: { type: string, format: uri }
      responses:
        "302":
          description: 重定向到 redirect_uri
        "200":
          description: 登出成功

  /connect/auth/revoketoken:
    post:
      summary: 令牌撤销（RFC 7009）
      description: 撤销已颁发的 access_token，使令牌立即失效。
      tags: [OAuth 2.0]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, client_secret, token]
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                token:
                  type: string
                  description: 需要撤销的 access_token
      responses:
        "200":
          description: 撤销成功（令牌不存在或已过期也返回成功）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeResponse"

  # ============================================================
  # OpenID Connect
  # ============================================================
  /connect/oidc/.well-known/openid-configuration:
    get:
      summary: OIDC 配置发现
      tags: [OIDC]
      responses:
        "200":
          description: OIDC 元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCConfig"

  /connect/oidc/.well-known/jwks.json:
    get:
      summary: 获取 JWK 公钥
      tags: [OIDC]
      responses:
        "200":
          description: JWK 公钥集
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKSet"

  /connect/oidc/authorize:
    get:
      summary: OIDC 授权端点
      description: 复用 OAuth2 的授权处理逻辑，支持 authorization code flow。
      tags: [OIDC]
      parameters:
        - $ref: "#/components/parameters/ClientID"
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: scope
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          schema:
            type: string
            pattern: "^[a-zA-Z0-9]{0,128}$"
        - name: nonce
          in: query
          description: 防重放攻击随机值，将在 ID Token 中返回
          schema: { type: string }
      responses:
        "302":
          description: 重定向到回调地址，附 code 参数

  /connect/oidc/token:
    post:
      summary: OIDC 令牌端点
      description: 用授权码换取 access_token 和 id_token。
      tags: [OIDC]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                code:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCTokenResponse"

  /connect/oidc/refreshtoken:
    post:
      summary: OIDC 令牌刷新
      tags: [OIDC]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, refresh_token, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [refresh_token]
                refresh_token:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCTokenResponse"

  /connect/oidc/revoketoken:
    post:
      summary: OIDC 令牌撤销（RFC 7009）
      description: 撤销 access_token 或 refresh_token，使令牌立即失效。
      tags: [OIDC]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, client_secret, token]
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                token:
                  type: string
                  description: 需要撤销的 access_token 或 refresh_token
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                  description: 令牌类型提示（可选）
      responses:
        "200":
          description: 撤销成功（令牌不存在或已过期也返回成功）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeResponse"

  /connect/oidc/userinfo:
    get:
      summary: OIDC 获取用户信息
      description: 使用 Bearer Token 认证获取已认证用户的详细信息。
      tags: [OIDC]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
        "401":
          description: 认证失败
    post:
      summary: OIDC 获取用户信息
      description: 使用 Bearer Token 认证，与 GET 方法等效。
      tags: [OIDC]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
        "401":
          description: 认证失败

  /connect/oidc/logout:
    get:
      summary: OIDC RP-Initiated Logout
      description: |
        遵循 OIDC RP-Initiated Logout 规范，清除用户会话。
        参数通过 Query 传递（fasthttp 的 FormValue 自动回退到 Query）。
      tags: [OIDC]
      parameters:
        - $ref: "#/components/parameters/ClientID"
        - name: post_logout_redirect_uri
          in: query
          schema: { type: string, format: uri }
        - name: state
          in: query
          schema:
            type: string
            pattern: "^[a-zA-Z0-9]{0,128}$"
      responses:
        "302":
          description: 重定向到 post_logout_redirect_uri
        "200":
          description: 登出成功

  # ============================================================
  # SAML 2.0
  # ============================================================
  /connect/saml/metadata:
    get:
      summary: 获取 IdP 元数据
      tags: [SAML 2.0]
      responses:
        "200":
          description: SAML 2.0 IdP 元数据 XML
          content:
            application/xml:
              schema:
                type: string

  /connect/saml/appmetadata:
    get:
      summary: 获取应用元数据
      description: 委托 metadata 处理，返回内容与 IdP 元数据一致。
      tags: [SAML 2.0]
      responses:
        "200":
          description: SAML 2.0 应用元数据 XML
          content:
            application/xml:
              schema:
                type: string

  # ============================================================
  # CAS 2.0
  # ============================================================
  /connect/cas/login:
    get:
      summary: CAS 认证入口
      tags: [CAS 2.0]
      parameters:
        - name: service
          in: query
          required: true
          schema: { type: string, format: uri }
          description: 认证后重定向的目标服务 URL
      responses:
        "302":
          description: 认证成功，重定向到 service 并附带 ticket
        "200":
          description: 未认证，返回登录页面

  /connect/cas/servicevalidate:
    get:
      summary: CAS 票据验证
      tags: [CAS 2.0]
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
        - name: service
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: format
          in: query
          schema:
            type: string
            enum: [xml, json]
            default: xml
      responses:
        "200":
          description: 验证结果
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/CASSuccessResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/CASJSONSuccessResponse"

  /connect/cas/getuserdetail:
    post:
      summary: CAS 获取用户详细信息
      tags: [CAS 2.0]
      parameters:
        - $ref: "#/components/parameters/Service"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userid]
              properties:
                userid:
                  type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CASUserDetailResponse"

  /connect/cas/proxy:
    get:
      summary: CAS 代理流程
      description: 处理代理票据（PT）和代理授予票据（PGT）的代理流程。
      tags: [CAS 2.0]
      parameters:
        - name: pgt
          in: query
          schema: { type: string }
          description: 代理授予票据
        - name: targetService
          in: query
          schema: { type: string, format: uri }
          description: 目标服务 URL
      responses:
        "200":
          description: 代理票据响应
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/CASSuccessResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/CASJSONSuccessResponse"

  /connect/cas/logout:
    get:
      summary: CAS 单点登出
      tags: [CAS 2.0]
      parameters:
        - name: service
          in: query
          schema: { type: string, format: uri }
      responses:
        "302":
          description: 重定向到 service

  # ============================================================
  # 远齐自研 SSO
  # ============================================================
  /sso/userlogin.html:
    get:
      summary: 获取 Token（远齐SSO）
      tags: [远齐SSO]
      parameters:
        - name: BackURL
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "302":
          description: 登录成功，回跳 BackURL 并附带 Token

  /sso/userlogin1.html:
    $ref: "#/paths/~1sso~1userlogin.html"

  /sso/gettoken.html:
    $ref: "#/paths/~1sso~1userlogin.html"

  /sso/_accinfo.html:
    post:
      summary: 获取用户身份（远齐SSO）
      tags: [远齐SSO]
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [token] }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YuanqiAccInfoResponse"

  /sso/clstoken.html:
    get:
      summary: 单点登出（远齐SSO）
      tags: [远齐SSO]
      parameters:
        - name: BackURL
          in: query
          schema: { type: string, format: uri }
      responses:
        "302":
          description: 重定向到 BackURL

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientID:
      name: client_id
      in: query
      required: true
      schema: { type: string }
      description: 应用ID
    Service:
      name: service
      in: query
      required: true
      schema: { type: string, format: uri }
      description: 关联的服务 URL

  schemas:
    # ---------- 通用 ----------
    ErrorResponse:
      type: object
      properties:
        errcode:
          type: integer
          description: 错误码，0 表示成功
        errmsg:
          type: string
      example:
        errcode: 40029
        errmsg: invalid code

    RevokeResponse:
      type: object
      description: 令牌撤销响应（RFC 7009）
      properties:
        errcode:
          type: integer
          description: 错误码，0 表示成功
        errmsg:
          type: string
      example:
        errcode: 0
        errmsg: ok

    # ---------- OAuth 2.0 ----------
    OAuth2TokenResponse:
      type: object
      properties:
        errcode: { type: integer }
        errmsg: { type: string }
        access_token: { type: string }
        expires_in: { type: integer }
      example:
        errcode: 0
        errmsg: ok
        access_token: accesstoken000001
        expires_in: 7200

    UserInfoResponse:
      type: object
      properties:
        errcode: { type: integer }
        errmsg: { type: string }
        userid: { type: string }
      example:
        errcode: 0
        errmsg: ok
        userid: USERID

    UserDetailResponse:
      type: object
      properties:
        userid: { type: string }
        gender: { type: string }
        avatar: { type: string }
        qr_code: { type: string }
        mobile: { type: string }
        email: { type: string }
        address: { type: string }
        login_name: { type: string }
        login_phone: { type: string }
        login_email: { type: string }

    # ---------- OIDC ----------
    OIDCConfig:
      type: object
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        userinfo_endpoint: { type: string }
        jwks_uri: { type: string }
        response_types_supported:
          type: array
          items: { type: string }
        subject_types_supported:
          type: array
          items: { type: string }
        id_token_signing_alg_values_supported:
          type: array
          items: { type: string }
        scopes_supported:
          type: array
          items: { type: string }
        claims_supported:
          type: array
          items: { type: string }
      example:
        issuer: http://sso.uieip.com/connect/oidc
        authorization_endpoint: http://sso.uieip.com/connect/oidc/authorize
        token_endpoint: http://sso.uieip.com/connect/oidc/token
        userinfo_endpoint: http://sso.uieip.com/connect/oidc/userinfo
        jwks_uri: http://sso.uieip.com/connect/oidc/.well-known/jwks.json
        response_types_supported: [code, id_token, token]
        subject_types_supported: [public]
        id_token_signing_alg_values_supported: [RS256]
        scopes_supported: [openid, profile, email]
        claims_supported: [sub, name, email, preferred_username]

    JWKSet:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              alg: { type: string }
              e: { type: string }
              kid: { type: string }
              kty: { type: string }
              n: { type: string }
              use: { type: string }

    OIDCTokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        id_token: { type: string }
      example:
        access_token: b66fcd08c19e47cb9076ff7679d3b72822bd7aed-f114-4c59-9590-204e7d563245
        token_type: Bearer
        expires_in: 3600
        id_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...

    # ---------- CAS 2.0 ----------
    CASSuccessResponse:
      type: object
      xml:
        name: cas:serviceResponse
      properties:
        authenticationSuccess:
          type: object
          xml:
            name: cas:authenticationSuccess
          properties:
            user: { type: string, xml: { name: cas:user } }
            attributes:
              type: object
              xml:
                name: cas:attributes

    CASJSONSuccessResponse:
      type: object
      properties:
        errcode: { type: integer }
        errmsg: { type: string }
        ticket: { type: string }
        user: { type: string }
        attributes:
          type: object

    CASUserDetailResponse:
      type: object
      properties:
        errcode: { type: integer }
        errmsg: { type: string }
        attributes:
          type: object

    # ---------- 远齐SSO ----------
    YuanqiAccInfoResponse:
      type: object
      properties:
        error: { type: integer }
        info: { type: string }
        userId: { type: string }
        nickname: { type: string }
        loginName: { type: string }
        phone: { type: string }
        email: { type: string }
        modifyTime: { type: string }
      example:
        error: 0
        info: ok
        userId: xxxx-xxxxx-xxxxx-xxx
        nickname: ocean
        loginName: spring
        phone: "13910000000"
        email: spring@yqsite.com
        modifyTime: "2025/01/12 12:04:23"
