<uieip type="page" value="base"></uieip>
<uieip type="reg" value="console"></uieip>
<html lang="zh">

<head>
	<uieip type="file" value="inc" src="/jsvm/inc/head.html"></uieip>
	<title>tmpl.base</title>
	<meta name="keywords" content="yuanqi ltd.">
</head>

<body>
	<uieip type="file" value="exec" src="/jsvm/inc/title_exec.html"></uieip>
	<div class="container">
		<h1>form.demo1</h1>
		<script runat="server">
			var isPostback = request.isPostback();
			if (isPostback) {
				response.write("postback:true " + "<br/>" + request.formGetValue("txt_input"));
				response.write("<br/>" + JSON.stringify(request.formGetValue("option2")));
			} else {
				request.formSetValue("option2", ["option2", "option3"]);
				request.formSetValue("txt_input", "开始测试");
				response.write("postback:false");
			}
		</script>
		<form method="post">
			<h3>input</h3>
			text:<input name="txt_input" type="text" value="" style="width: 150px;" />
			<br />checkbox:
			<input type="checkbox" name="option2" value="option1" />
			<input type="checkbox" name="option2" value="option2" />
			<input type="checkbox" name="option2" value="option3" />
			<br />radio:
			<input type="radio" name="radio2" value="radio1" />
			<input type="radio" name="radio2" value="radio2" />
			<input type="radio" name="radio2" value="radio3" />
			<br />color:
			<input type="color" name="color2" />
			<br />date:
			<input type="date" name="date2" />
			<br />datetime-local:
			<input type="datetime-local" name="datetime-local2" />
			<br />select:
			<select name="select2">
				<option value="volvo">Volvo</option>
				<option value="saab">Saab</option>
				<option value="mercedes">Mercedes</option>
				<option value="audi">Audi</option>
			</select>
			<br />textarea:
			<textarea name="textarea2" rows="10" cols="30" style="width: 500px;height: 50px;">我是一个文本框。</textarea>
			<br /><button onclick="submit()">提交</button>
		</form>
		<uieip type="file" value="code" src="demo1.html"></uieip>
	</div>
	<uieip type="file" value="inc" src="/jsvm/inc/foot.html"></uieip>
</body>

</html>
