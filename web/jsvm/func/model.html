<!doctype html>
<uieip type="page" value="login" debug="true" timeout="5000"></uieip>
<uieip type="reg" value="console,model"></uieip>
<html lang="zh">

<head>
	<uieip type="file" value="inc" src="/jsvm/inc/head.html"></uieip>
	<title>model</title>
	<meta name="keywords" content="yuanqi ltd.">
	<script>
		<uieip type="tmpl" value="model.params" appno="0" menuno="1001"></uieip>
	</script>
</head>

<body>
	<uieip type="file" value="exec" src="/jsvm/inc/title_exec.html"></uieip>
	<div class="container">
		<h1>model.menus(0)</h1>
		<textarea style="width: 100%; height: 180px; font-size: 14px;"><uieip>str_menus</uieip></textarea>
		<h1>model.params(0,1)</h1>
		<textarea style="width: 100%; height: 100px; font-size: 14px;"><uieip>str_params</uieip></textarea>
		<h1>model.userinfo()</h1>
		<textarea style="width: 100%; height: 100px; font-size: 14px;"><uieip>str_userinfo</uieip></textarea>
		<h1>request.data("model.title") request.data("model.params")</h1>
		<textarea style="width: 100%; height: 100px; font-size: 14px;"><uieip>str_title</uieip></textarea>
		<uieip type="file" value="code" src="model.html"></uieip>
	</div>
	<uieip type="file" value="inc" src="/jsvm/inc/foot.html"></uieip>
	<script runat="server">
		var str_menus;
		var _menus = model.menus(0);
		if (_menus === null) {
			str_menus = "";
		} else {
			str_menus = JSON.stringify(_menus, null, 4);
		}

		var str_params;
		var _params = model.params(0, 1);
		if (_params === null) {
			str_params = "";
		} else {
			str_params = JSON.stringify(_params, null, 4);
		}

		var str_userinfo;
		var _userinfo = model.userinfo();
		if (_userinfo === null) {
			str_userinfo = "";
		} else {
			str_userinfo = JSON.stringify(_userinfo, null, 4);
		}

		var str_title;
		var _title = request.data("model.title");
		if (_title === null) {
			str_title = "";
		} else {
			str_title = JSON.stringify(_title, null, 4);
		}
	</script>
</body>

</html>
