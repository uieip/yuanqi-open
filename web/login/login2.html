<uieip type="reg" value="login,session,console"></uieip>
<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/scripts/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/scripts/cms/yq_docs.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="/scripts/vue/font-awesome/font-awesome.min.css">
  <title>登录页</title>
  <style>
    body {
      background: #f5f5f5;
    }

    .container.inner-info {
      margin-top: 50px;
    }

    *:focus,
    *:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      outline-color: transparent !important;
      outline-style: none !important;
      outline-width: 0 !important;
      --el-focus-ring-color: transparent !important;
    }

    #app {
      width: 380px;
      height: 370px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 32px;
    }

    .login-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid #f0f0f0;
    }

    .login-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: #666;
      font-size: 16px;
      font-weight: 400;
      position: relative;
      transition: color 0.2s ease;
      outline: none;
      box-shadow: none;
    }

    .login-tab:focus,
    .login-tab:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    #app .login-tabs .login-tab:focus,
    #app .login-tabs .login-tab:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    #app .login-tabs a.login-tab:focus,
    #app .login-tabs a.login-tab:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    .login-tab:hover {
      color: #1677ff;
    }

    .login-tab.active {
      color: #1677ff;
      font-weight: 500;
    }

    .login-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      background: #1677ff;
      border-radius: 1px;
    }
  </style>
</head>

<body>
  <div class="container inner-info">
    <div class="row">
      <div class="col-md-6 col-sm-12">
        1111
      </div>
      <div class="col-md-6 col-sm-12">
        <div id="app">
          <div class="login-tabs">
            <yq-label class="login-tab" :class="{ active: currentType === 'password' }" label="账密登录"
              :label-dict="{ 'zh-CN': '账密登录', 'en': 'Password' }" @click="showLogin('password')"></yq-label>
            <yq-label class="login-tab" :class="{ active: currentType === 'phone' }" label="手机/邮箱登录"
              :label-dict="{ 'zh-CN': '手机/邮箱登录', 'en': 'Phone/Email' }" @click="showLogin('phone')"></yq-label>
            <yq-label class="login-tab" :class="{ active: currentType === 'wechat' }" label="微信登录"
              :label-dict="{ 'zh-CN': '微信登录', 'en': 'WeChat' }" @click="showLogin('wechat')"></yq-label>
          </div>
          <div ref="loginRef" class="login-container"></div>
        </div>
      </div>
    </div>
  </div>


  <script type="module">
    import { createApp, onMounted, ref } from 'vue'
    import ElementPlus from 'element-plus'
    import { ElSelect, ElOption } from 'element-plus'
    import zhCn from 'element-plus/es/locale/lang/zh-cn'
    import 'element-plus/dist/index.css'
    // 导入组件
    import { YqLogin, YqPhoneEmail, YqLoginThird, YqLabel } from '/src'

    createApp({
      components: {
        'login': YqLogin,
        'phone-email': YqPhoneEmail,
        'login-third': YqLoginThird,
        YqLabel,
      },
      setup() {
        const loginRef = ref(null)
        const currentType = ref('password')
        // 保存当前挂载的子应用实例，切换前需先 unmount，避免重复挂载告警
        let loginApp = null

        const showLogin = (type) => {
          currentType.value = type
          // 先卸载上一个挂载到 loginRef 容器的子应用
          if (loginApp) {
            loginApp.unmount()
            loginApp = null
          }
          if (type === 'password') {
            loginApp = createApp(YqLogin)
          }
          else if (type === 'phone') {
            loginApp = createApp(YqPhoneEmail)
          }
          else if (type === 'wechat') {
            loginApp = createApp(YqLoginThird)
          }
          if (loginApp) {
            loginApp.mount(loginRef.value)
          }
        }

        onMounted(() => {
          showLogin('password')
        })
        return {
          loginRef,
          showLogin,
          currentType
        }
      }
    }).mount('#app')
  </script>
  <script runat="server">
    // 如果是登录状态，重定向到回调URL
    const backurl = request.param("backurl");
    var lg_state = login.state();
    if (lg_state) {
      if (backurl === null) {
        response.redirect("/index.html");
      }
      else {
        response.redirect(backurl);
      }
    }
  </script>
</body>

</html>
