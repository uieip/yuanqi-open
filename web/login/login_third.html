<!doctype html>
<html>

<head>
    <title>登录</title>
</head>

<body>
    <div id="login_info"></div>
    <script>
        var login_info;
        init();

        async function init() {
            // 获取登录前的页面url
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code') || '';
            let link_type = urlParams.get('type') || 'weixin';

            if (code === '') {
                document.getElementById("login_info").innerHTML = "登录失败，code为空";

                const origin = window.location.origin
                const backurl = urlParams.get('backurl') || '/index.html'
                let redirect_uri = `${origin}/login/login_third.html`;

                let formData = new FormData();
                formData.append('action', 'thirdauthorize');
                formData.append('backurl', backurl);
                formData.append('type', link_type);
                formData.append('redirect_uri', redirect_uri);

                const response = await fetch('/_login.html', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                console.log(data);

                if (data.error === 0) {
                    top.location.href = data.url;
                } else {
                    document.getElementById("login_info").innerHTML = "登录失败，" + data.info;
                }
                return;
            }

            let state = urlParams.get('state') || '';
            if (state === null) {
                state = "";
                link_type = "weixin";
            } else {
                var vals = state.split("@");
                link_type = vals[0];
                if (vals.length > 1) {
                    state = vals[1];
                }
            }

            let formData = new FormData();
            formData.append('action', 'thirdcheck');
            formData.append('type', link_type);
            formData.append('code', code);

            const response = await fetch('/_login.html', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            console.log(data);

            // 客户端（Electron/Tauri）以 iframe 嵌入本页：通过 postMessage 把登录结果
            // （含服务端会话 ssid 与签名密钥 sessionKey）回传父窗口，由客户端完成登录态写入。
            // 网页版（顶层窗口）保持原有跳转行为不变。
            if (window.parent && window.parent !== window) {
                const ssidMatch = document.cookie.match(/(?:^|;\s*)ssid=([^;]+)/);
                window.parent.postMessage({
                    source: 'yuanqi-third-login',
                    error: data.error,
                    info: data.info,
                    sessionKey: data.sessionKey,
                    url: data.url,
                    ssid: ssidMatch ? ssidMatch[1] : ''
                }, '*');
                return;
            }

            if (data.error === 0) {
                top.location.href = data.url;
            } else {
                document.getElementById("login_info").innerHTML = "登录失败，" + data.info;
            }
        }
    </script>
</body>

</html>
