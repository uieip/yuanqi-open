<uieip type="page" value="login"></uieip>
<uieip type="reg" value="console,login,session"></uieip>
<!doctype html>
<html>

<head>
    <uieip type="file" value="inc" src="/cms/inc/pc_head_inc.html"></uieip>
    <title>登录</title>
</head>

<body>
    <uieip type="file" value="exec" src="/cms/inc/pc_topmenu_exec.html"></uieip>
    <div class="container">
        <div class="row" style="margin-top:100px">
            <div class="col-md-offset-4 col-md-4 col-md-offset-3 col-md-5" style="padding: 30px;">
                <div class="panel panel-default">
                    <div class="panel-heading">第三方登录删除关联</div>
                    <div class="panel-body">
                        <div id="login_info"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <uieip type="file" value="inc" src="/cms/inc/pc_footer_inc.html"></uieip>
    <script>
        var login_info;
        init();

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            let backurl = urlParams.get('backurl') || '';
            if (backurl === '') {
                backurl = "/";
            }

            let link_type = urlParams.get('type') || 'weixin';
            if (link_type === null) {
                link_type = "weixin";
            }

            let formData = new FormData();
            formData.append('action', 'thirdunlink');
            formData.append('type', link_type);

            const response = await fetch('/_login.html', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            console.log(data);

            if (data.error === 0) {
                top.location.href = backurl;
            } else {
                document.getElementById("login_info").innerHTML = "登录失败，" + data.info;
            }
        }
    </script>
</body>

</html>
