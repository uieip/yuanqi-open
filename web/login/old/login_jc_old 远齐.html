<uieip type="page" value="base"></uieip>
<uieip type="reg" value="console,login,session,http"></uieip>
<!doctype html>
<html>

<head>
    <uieip type="file" value="inc" src="/jsvm/inc/head.html"></uieip>
    <title>登录</title>
</head>

<body>
    <uieip type="file" value="exec" src="/jsvm/inc/title_exec.html"></uieip>
    <div class="container">
        <div class="row" style="margin-top:100px">
            <div class="col-md-offset-4 col-md-4 col-md-offset-3 col-md-5" style="padding: 30px;">
                <div class="panel panel-default">
                    <div class="panel-heading">用户登录</div>
                    <div class="panel-body">
                        <uieip>login_info</uieip>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <uieip type="file" value="inc" src="/jsvm/inc/foot.html"></uieip>
    <script runat="server">
        /* 
            远齐登录流程
            1. 调用sso登录接口，获取Token
            2. 调用sso登录接口，获取用户信息
            3. 调用登录接口，登录用户
            4. 跳转到登录前的页面
        */
        var login_info;
        init();

        function init() {
            var backurl = request.param("backurl");
            if (login.state()) {
                if (backurl === null) {
                    response.redirect(request.baseurl());
                } else {
                    response.redirect(backurl);
                }
                return;
            }

            var token = request.param("Token");
            if (token === null) {
                if (!(backurl === null)) {
                    session.set("backurl", backurl);
                }
                var redirect_uri = request.baseurl() + "/" + request.url();

                response.redirect("http://sso.uieip.com/sso/userlogin.html?BackURL=" + encodeURIComponent(redirect_uri));
                return;
            }

            var backurl = session.getValue("backurl");
            if (backurl === null) {
                backurl = "/login/index.html";
            }

            var res = get_userinfo(token);
            if (res.error == 0) {
                login_check(res.data)
                return;
            } {
                login_info = "<p>" + res.info + "[" + res.error + "]</p><a href=\"javascript:clear_get();\">重新登录</a>";
            }
        }

        function get_userinfo(token) {
            var res = http.get("http://sso.uieip.com/SSO/_AccInfo.html?action=token&token=" + token, {
                "Accept": "application/json"
            });

            return res;
        }

        function login_check(user) {
            var ck = login.check(user.userId);
            if (ck.error == 0) {
                backurl = session.getString("backurl");
                if (backurl === undefined) {
                    response.redirect(backurl_link);
                } else {
                    response.redirect(backurl);
                    session.delete("backurl");
                }
            } else if (ck.error == 2) {  //用户在本地不存在
                login_info = "<p>登录用户：" + payload.login_name + " 不存在</p><a href=\"javascript:clear_get();\">重新登录</a>";
            } else {
                login_info = "<p>" + ck.info + "[" + ck.error + "]</p><a href=\"javascript:clear_get();\">重新登录</a>";
            }
        }
    </script>
</body>

</html>
