<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
    <title>flowchart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }

        #app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .test-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 12px;
            background-color: #f5f7fa;
            border-bottom: 1px solid #e4e7ed;
            flex-shrink: 0;
        }

        .flow-container {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .preview-panel {
            height: 240px;
            display: flex;
            flex-direction: column;
            border-top: 2px solid #e4e7ed;
            flex-shrink: 0;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background-color: #f5f7fa;
            border-bottom: 1px solid #e4e7ed;
            font-weight: bold;
            font-size: 13px;
            color: #303133;
        }

        .preview-content {
            flex: 1;
            overflow: auto;
            padding: 8px;
            background-color: #fff;
        }

        .json-preview {
            margin: 0;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="test-header">
            <a href="javascript:window.history.back();">返回</a>
            <el-switch v-model="isEdit" active-text="编辑模式" inactive-text="预览模式"></el-switch>
            <el-switch v-model="mini" active-text="迷你模式" inactive-text="正常模式"></el-switch>
            <el-button type="primary" @click="onGetValue">getValue</el-button>
            <el-button type="success" @click="loadSampleData">加载示例数据</el-button>
            <el-button @click="clearData">clear</el-button>
        </div>
        <div class="flow-container">
            <yq-flow-edit v-model="flowData" :is-edit="isEdit" :mini="mini" :on-save="onSave" @change="onChange" />
        </div>
        <div class="preview-panel">
            <div class="preview-header">
                <span>流程图数据预览</span>
            </div>
            <div class="preview-content">
                <pre class="json-preview">{{ savedModel }}</pre>
            </div>
        </div>
    </div>
    <script>

        const { initTheme, YqFlowEdit } = YqwinPlus;

        initTheme();

        const flowDemo = {

                { "category": "End", "key": 15, "loc": "356 671", "text": "End", "desc": "End", "size": "95 60" },
                {
                    "category": "Comment", "text": "标题", "key": 16, "loc": "171.50 -75",
                    "desc": "1、232\n2、lso allows Gr \n3、这是测试，这是测试，这是测试，这是测试这是测试这是测试这是测试这是测试",
                    "size": "200 140", "class": 10
                }
            ],
            "link": [
                { "from": 1, "to": 6, "text": "提交aaaa", "mmdId": 1, "points": "-122.5,-45,-112.5,-45,-112.5,42,-77,42,-77,-19,3,-19,3,49,3,59", "desc": "提交" },

                { "from": 10, "to": 12, "text": "同意", "mmdId": 1, "points": "-99,374,-89,374,-74,374,-74,466,-59,466,-49,466", "desc": "同意" },
                { "from": 9, "to": 12, "text": "同意", "mmdId": 1, "points": "138,388,138,398,138,412,61,412,61,426,61,436", "desc": "同意" },
                { "from": 12, "to": 13, "text": "Yes", "mmdId": 1, "points": "61,496,61,506,61,519.5,61,519.5,61,533,61,543", "desc": "Yes" },
                { "from": 12, "to": 14, "text": "No", "mmdId": 8, "points": "171,466,181,466,235.25,466,235.25,539,289.5,539,299.5,539", "desc": "No" },
                { "from": 13, "to": 8, "text": "同意", "mmdId": 1, "points": "61,583,61,593,61,611.5,-107.5,611.5,-107.5,630,-107.5,640", "desc": "同意" },
                { "from": 8, "to": 11, "text": "同意", "mmdId": 1, "points": "-30,670,-20,670,15.5,670,15.5,672,51,672,61,672", "desc": "同意" },
                { "from": 2, "to": 5, "text": "重新提交", "mmdId": 2, "points": "345.5,85,345.5,95,345.5,170.5,364,170.5,364,246,364,256", "desc": "重新提交" }
            ]
        };

        const cloneData = (v) => JSON.parse(JSON.stringify(v));
        const formatJson = (v) => JSON.stringify(v, null, 2);

        const app = createApp({
            components: {
                YqFlowEdit
            },
            setup() {
                const isEdit = ref(true);
                const mini = ref(false);
                const flowData = ref(cloneData(flowDemo));
                const savedModel = ref(formatJson(flowData.value));

                const onSave = (event, data) => {
                    console.log('save event:', event, 'data:', data);
                };

                const onChange = (data) => {
                    savedModel.value = formatJson(data);
                };

                const onGetValue = () => {
                    savedModel.value = formatJson(flowData.value);
                };

                const loadSampleData = () => {
                    flowData.value = cloneData(flowDemo);
                    savedModel.value = formatJson(flowData.value);
                };

                const clearData = () => {
                    flowData.value = { info: {}, node: [], link: [] };
                    savedModel.value = formatJson(flowData.value);
                };

                return {
                    isEdit,
                    mini,
                    flowData,
                    savedModel,
                    onSave,
                    onChange,
                    onGetValue,
                    loadSampleData,
                    clearData
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>

</html>
