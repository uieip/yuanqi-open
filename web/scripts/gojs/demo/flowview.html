        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }

        #app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .test-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 12px;
            background-color: #f5f7fa;
            border-bottom: 1px solid #e4e7ed;
            flex-shrink: 0;
        }

        .flow-container {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .preview-panel {
            height: 200px;
            display: flex;
            flex-direction: column;
            border-top: 2px solid #e4e7ed;
            flex-shrink: 0;
        }

        .preview-header {
            padding: 6px 12px;
            background-color: #f5f7fa;
            border-bottom: 1px solid #e4e7ed;
            font-weight: bold;
            font-size: 13px;
            color: #303133;
        }

        .preview-content {
            flex: 1;
            overflow: auto;
            padding: 8px;
            background-color: #fff;
        }

        .json-preview {
            margin: 0;
            font-size: 13px;
            color: #333;
        }
    </style>

                    savedModel.value = formatJson(data);
                };

                    savedModel.value = formatJson(flowData.value);
                };

                    testType,

                    users,
