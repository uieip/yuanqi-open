|8|editHeight|int|450|显示框高度|

# 900.uiMask
ui_mask字段设置

#901.param（属性设置）
虚表字段，显示界面不使用
数据格式
```json
{
	"titles": [{
		"is_func": false,
		"name": "title",
		"ui_title": "Title",
		"ui_type": 2,
		"ui_width": 80,
		"ui_visible": true,
		"ui_readonly": false,
		"ui_mask": "{\"default\":\"111\"}"
	},
	}],
	"model": [{
		"describe": "Html模板",
		"model": "<table _n=\"_tb\"></table>\n",
		"type": 2,
		"no": "1"
	},]
}
```
- titles:字段属性
- model:模板
type==1:表格模板
type==2:web form模板
type==3:Code编码模板
