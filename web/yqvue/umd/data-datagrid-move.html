<uieip type="page" value="base"></uieip>
<uieip type="reg" value="console,login,session"></uieip>
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
  <link rel="stylesheet" href="/test-ui.css">
    <title>数据表格测试[排序]</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }

        #app {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 14px;
            font-weight: 500;
        }

        .divider {
            margin: 0 10px;
            color: #909399;
        }

        .yq-data-grid-container {
            height: calc(100vh - 350px);
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .yq-data-grid .warning-row {
            background-color: #fdf5e6;
        }

        .yq-data-grid .success-row {
            background-color: #e6f5e9;
        }

        .data-log {
            height: 200px;
            overflow: auto;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            padding: 15px;
            background-color: #f9f9f9;
        }

        .data-log pre {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #409eff;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #606266;
        }
    </style>
</head>

<body>
    <div id="app2">
        <h1>{{ info }}</h1>
    </div>

    <div id="app">
        <h1>数据表格测试[排序]</h1>
        <div class="control-panel">
            <div class="control-group">
                <el-switch v-model="isEdit" active-text="编辑" inactive-text="非编辑"></el-switch>
            </div>
            <span class="divider">|</span>
            <div class="control-group">
                <el-switch v-model="rownumbers" active-text="显示行号" inactive-text="不显示行号"></el-switch>
            </div>
            <span class="divider">|</span>
            <div class="control-group">
                <el-switch v-model="showMenu" active-text="显示菜单" inactive-text="不显示菜单"></el-switch>
            </div>
            <span class="divider">|</span>
            <div class="control-group">
                <label>顶部菜单设置->显示个数</label>
                <el-input-number v-model="topnum" :min="3" :max="99" :step="1" label="顶部菜单个数设置"
                    style="width: 100px;"></el-input-number>
                <el-checkbox v-model="btnMini" label="显示按钮菜单"></el-checkbox>
            </div>
            <span class="divider">|</span>
            <div class="control-group">
                <label>编辑模式</label>
                <el-select v-model="editMode" placeholder="请选择编辑模式" style="width: 150px;">
                    <el-option label="自由编辑1" value="1"></el-option>
                    <el-option label="自由编辑2" value="2"></el-option>
                    <el-option label="编辑(模态窗体)" value="3"></el-option>
                    <el-option label="编辑(独立)" value="4"></el-option>
                </el-select>
            </div>
            <span class="divider">|</span>
            <div class="control-group">
                <label>编辑类型</label>
                <el-select v-model="editType" placeholder="请选择编辑类型" style="width: 150px;">
                    <el-option label="属性编辑模式" value="1"></el-option>
                    <el-option label="form编辑模式" value="2"></el-option>
                </el-select>
            </div>
        </div>

        <div class="section-title">数据表格</div>
        <div class="yq-data-grid-container">
            <yq-data-grid ref="singleTable" :is-demo="isDemo" :ajax-url="ajaxUrl" :dbname="dbname" :tbname="tbname"
                :key-id="keyId" :binding-key-id="bindingKeyId" :binding-value="bindingValue" :p-key-id="pKeyId"
                :p-key-value="pKeyValue" :tempno="tempno" :add-where="addWhere" :order="order" :is-page="isPage"
                :page-size="pageSize" :rownumbers="rownumbers" :frozen-num="frozenNum" :row-class-name="rowClassName"
                :border="true" :load-data="loadData" :height="height" :edit-title="editTitle" :edit-mode="editModeInt"
                :edit-type="editTypeInt" :edit-mode-w="editModeW" :edit-mode-h="editModeH" :edit-mode-no="editModeNo"
                :edit-url="editUrl" :is-edit="isEdit" :btn-mini="btnMini" :topnum="topnum" :copy="copy" :add="add"
                :upp="upp" :del="del" :state="state" :state-field="stateField" :isdel="isdel" :isdel-edit="isdelEdit"
                :move="move" :to-excel="toexcel" :excel-name="excelName" :in-excel="inexcel" :show-menu="showMenu"
                :edit-links="editLinks" :edit-links_r="editLinks_r" :selected="selected" @change="dataChange"
                :before-set-titles="beforeSetTitles" :before-set-data="beforeSetData"
                :before-set-topmenus="beforeSetTopmenus" @row-click="afterRowclick"
                @row-select="afterRowSelect"
                :after-set-titles="afterSetTitles"
                ></yq-data-grid>
        </div>

        <div class="section-title">数据日志</div>
        <div class="data-log">
            <pre>{{data}}</pre>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, watch } = Vue;
        const { initTheme, yqData, YqDataGrid } = YqwinPlus;
        initTheme();

        // 页面参数
        const eipParams = {
            $tbRef:null,
            dbname:'',
            tbname:'ab_test_move',
        }

        // 初始化应用
        window.onload = async function () {
            try {
                const res = await yqData.dbList()
                if (res.error === 0 && res.rows && res.rows.length > 0) {
                    eipParams.dbname = res.rows[0].name
                }
            } catch (error) {
                console.error('获取数据库列表失败:', error)
            } finally {
                initApp()
            }
        }

        // 页面加载完成后处理
        const eipLoaded = async () => {
            if (!eipParams.$tbRef) {
                return
            }
            await eipParams.$tbRef.loadData()
        }

        //组件1
        const initApp = () => {
            const app = createApp({
                components: {
                    YqDataGrid
                },

                setup() {
                    const singleTable = ref(null)

                    const editMode = ref("3")
                    const editType = ref("1")
                    const _editMode = localStorage.getItem('data-datagrid-editMode')
                    editMode.value = _editMode || "3"
                    const _editType = localStorage.getItem('data-datagrid-editType')
                    editType.value = _editType || "1"

                    // 监听侧边栏折叠状态变化，存储到localStorage
                    watch(editMode, (newValue) => {
                        localStorage.setItem('data-datagrid-editMode', newValue)
                    })
                    watch(editType, (newValue) => {
                        localStorage.setItem('data-datagrid-editType', newValue)
                    })

                    // 响应式数据
                    const isDemo = ref(false)
                    const ajaxUrl = ref("/_db.html")
                    const tbname = ref("ab_test_move")
                    const dbname = ref(eipParams.dbname)
                    const keyId = ref("sid")
                    const bindingKeyId = ref(null)
                    const bindingValue = ref(null)
                    const pKeyId = ref(null)
                    const pKeyValue = ref(null)
                    const tempno = ref(1)
                    const addWhere = ref("")
                    const order = ref("queue,sid")
                    const frozenNum = ref(0)
                    const editModeW = ref(700)
                    const editModeH = ref(550)
                    const editModeNo = ref(2)
                    const loadData = ref(false)
                    const isPage = ref(false)
                    const pageSize = ref(10)
                    const isEdit = ref(true)
                    const btnMini = ref(false)
                    const topnum = ref(4)
                    const copy = ref(true)
                    const add = ref(true)
                    const upp = ref(true)
                    const del = ref(true)
                    const state = ref(true)
                    const stateField = ref("combobox")
                    const isdel = ref(true)
                    const isdelEdit = ref(false)
                    const move = ref(true)
                    const toexcel = ref(true)
                    const excelName = ref("excel导出")
                    const inexcel = ref(true)
                    const rownumbers = ref(true)
                    const showMenu = ref(true)

                    const selectedRow = ref(null);

                    const selected = ref(true);

                    const editLinks = computed(() => [{
                        label: "测试按钮",
                        toptip: "排序",
                        icon: "fa fa-sort",
                        type: "primary",
                        divided: true,
                        disabled: false,
                        click: () => {
                            console.log("排序")
                        }
                    }, {
                        label: "注销",
                        toptip: "isdel",
                        icon: "fa fa-toggle-off",
                        type: "danger",
                        divided: false,
                        disabled: () => {
                            if (selectedRow.value === null) {
                                return true
                            }
                            const isdel = selectedRow.value["isdel"]
                            return (isdel || isdel === 1)
                        },
                        click: () => {
                            singleTable.value.saveData([{
                                action: "upp_",
                                row: {
                                    sid: selectedRow.value["sid"],
                                    isdel: true
                                }
                            }])
                        }
                    }]);
                    const editLinks_r = computed(() => [{
                        label: "注销",
                        toptip: "isdel",
                        icon: "fa fa-toggle-off",
                        type: "danger",
                        divided: false,
                        disabled: () => {
                            if (selectedRow.value === null) {
                                return true
                            }
                            const isdel = selectedRow.value["isdel"]
                            return (isdel || isdel === 1)
                        },
                        click: () => {
                            singleTable.value.saveData([{
                                action: "upp_",
                                row: {
                                    sid: selectedRow.value["sid"],
                                    isdel: true
                                }
                            }])
                        }
                    }]);

                    const editTitle = ref("编辑")
                    const rowClassName = ref(null)
                    const selectedId = ref(null)
                    const data = ref({ rows: [] })
                    const height = ref('calc(100vh - 350px)')

                    // 计算属性
                    const editModeInt = computed(() => parseInt(editMode.value))
                    const editTypeInt = computed(() => parseInt(editType.value))
                    const editUrl = computed(() => "data-datagrid-edit.html")

                    // 方法
                    const dataChange = (rows) => {
                        selectedId.value = null
                        console.log('@dataChange:', rows)
                    }

                    const beforeSetData = async (rows) => {
                        console.log('beforeSetData:', rows)
                        return rows
                    }

                    const beforeSetTitles = async (titles) => {
                        console.log('beforeSetTitles:', titles)
                        return titles
                    }
                    const afterRowclick = async (res) => {
                        console.log("Rowclick:", res)

                    }

                    const afterRowSelect = async (res) => {
                        console.log("RowSelect:", res)
                    }

                    const beforeSetTopmenus = (menus) => {
                        console.log('beforeSetTopmenus:', menus)
                        return menus
                    }

                    const afterSetTitles = async () => {
                        console.log('afterSetTitles')

                        if (singleTable.value) {
                            eipParams.$tbRef = singleTable.value
                        }

                        initApp2()
                    }

                    return {
                        singleTable,
                        // 响应式数据
                        editMode,
                        editType,
                        isDemo,
                        ajaxUrl,
                        dbname,
                        tbname,
                        keyId,
                        bindingKeyId,
                        bindingValue,
                        pKeyId,
                        pKeyValue,
                        tempno,
                        addWhere,
                        order,
                        frozenNum,
                        editModeW,
                        editModeH,
                        editModeNo,
                        loadData,
                        isPage,
                        pageSize,
                        isEdit,
                        btnMini,
                        topnum,
                        copy,
                        add,
                        upp,
                        del,
                        state,
                        stateField,
                        isdel,
                        isdelEdit,
                        move,
                        toexcel,
                        excelName,
                        inexcel,
                        rownumbers,
                        showMenu,
                        editLinks,
                        editLinks_r,
                        editTitle,
                        rowClassName,
                        selectedId,
                        data,
                        height,
                        // 计算属性
                        editModeInt,
                        editTypeInt,
                        editUrl,
                        selected,

                        beforeSetTitles,
                        afterRowclick,
                        afterRowSelect,
                        beforeSetTopmenus,
                        afterSetTitles,

                        beforeSetData,
                        // 方法
                        dataChange,
                    }
                }
            })

            app.use(ElementPlus)
            app.mount('#app')
        }

        //组件2
        const initApp2 = () => {
            const app = createApp({
                setup() {
                    const info = ref("页面加载成功。")
                    return {
                        info,
                    }
                }
            })

            app.use(ElementPlus);
            app.mount('#app2');

            eipLoaded();
        }
    </script>
</body>

</html>
