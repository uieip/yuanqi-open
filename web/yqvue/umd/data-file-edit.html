<uieip type="page" value="base"></uieip>
<uieip type="reg" value="console,login,session"></uieip>
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
  <link rel="stylesheet" href="/test-ui.css">
    <title>YqFileEdit 测试页面</title>
    <style>
        body {
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }
        #app {
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        .control-panel {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #e4e7ed;
            border-radius: 4px;
            background-color: #f5f7fa;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .component-container {
            padding: 0;
            min-height: 300px;
            height: calc(100vh - 250px);
            background-color: white;
            border: 1px solid #9a9ca1;
            overflow: auto;
        }

    </style>
</head>

<body style="height: auto;">
    <div id="app">
        <h1>YqFileEdit 组件测试</h1>

        <div class="control-panel">
            <h3>控制面板</h3>

            <div class="control-group">
                <el-switch v-model="isEdit" :active-value="true" :inactive-value="false" active-text="编辑模式"
                    inactive-text="查看模式"></el-switch>

                <el-switch v-model="goDocEnd" :active-value="true" :inactive-value="false" active-text="跳转文档末尾"
                    inactive-text="不跳转"></el-switch>

                <el-switch v-model="runfile" :active-value="true" :inactive-value="false" active-text="运行文件"
                    inactive-text="不运行"></el-switch>
            </div>
            文件 <el-select v-model="filePath" placeholder="请选择文件" style="width: 200px;">
                <el-option label="404.html" value="404.html"></el-option>
                <el-option label="readme.md" value="readme.md"></el-option>
                <el-option label="document\data.ujson" value="document\data.ujson"></el-option>
            </el-select>
        </div>
        <div class="component-container">
            <yq-file-edit :is-edit="isEdit" :file-path="filePath" :go-doc-end="goDocEnd"
                :runfile="runfile"></yq-file-edit>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        const { initTheme, YqFileEdit } = YqwinPlus;
        initTheme();

        const app = createApp({
            components: {
                YqFileEdit
            },
            setup() {
                // 基本状态
                const isEdit = ref(true);
                const goDocEnd = ref(false);
                const runfile = ref(true);

                // 示例文件数据
                const filePath = ref('404.html');


                return {
                    isEdit,
                    goDocEnd,
                    runfile,
                    filePath
                };
            }
        });

        app.use(ElementPlus);

        app.mount('#app');
    </script>
</body>

</html>
