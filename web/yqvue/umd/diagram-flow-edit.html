    <title>YqFlowEdit 流程图编辑组件测试</title>
    <link rel="stylesheet" type="text/css" href="/font-awesome.min.css">
    <style>
        @font-face {
            font-family: 'FontAwesome';
            src: url('/fonts/fontawesome-webfont.woff2?v=4.7.0') format('woff2'),
                url('/fonts/fontawesome-webfont.woff?v=4.7.0') format('woff');
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: auto;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        .test-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px 20px;
            background-color: var(--el-fill-color-light, #f5f7fa);
            border-bottom: 1px solid var(--el-border-color-light, #e4e7ed);
        }

        .flow-container {
            width: 100%;
            height: calc(100% - 150px);
        }

        .test-content {
            padding: 10px 20px;
            background-color: var(--el-bg-color, #fff);
            border-top: 1px solid var(--el-border-color-light, #e4e7ed);
            height: 300px;
            overflow: auto;
        }

        .json-preview {
            font-size: 14px;
            color: var(--el-text-color-primary, #303133);
            background-color: var(--el-fill-color-light, #f9f9f9);
            padding: 10px;
            border-radius: 4px;
        }

        .json-preview pre {
            margin: 0;
        }
    </style>
</head>

            <el-button type="success" @click="clearData">清空画布</el-button>

        <div class="flow-container">
            <yq-flow-edit v-model="flowData" :is-edit="isEdit" :mini="mini" :on-save="onSave" @change="handleChange" />

            </div>
            <div class="test-content">
                <pre id="flowDataPreview" class="json-preview">{{ flowData }}</pre>
            </div>

                const mini = ref(false);
                const onSave = (event , data ) => {
                    console.log(event, data);
                };
                
                const handleChange = (data) => {
                    document.getElementById('jsonOutput').textContent = formatJson(data);
                };

                const loadSampleData = () => {
                    flowData.value = JSON.parse(JSON.stringify(flowDemo));
                };

                const clearData = () => {
                    flowData.value = {
                        info: {},
                        node: [],
                        link: []
                    };
                };

                const updateJsonOutput = (val) => {
                    const jsonOutput = document.getElementById('jsonOutput');
                    if (jsonOutput) {
                        jsonOutput.textContent = formatJson(val);
                    }
                };

                watch(flowData, (val) => {
                    updateJsonOutput(val);
                }, { deep: true });

                onMounted(() => {
                    updateJsonOutput(flowData.value);
                });

                return {
                    isEdit,
                    flowData,
                    mini,
                    onSave,
                    handleChange,
                    loadSampleData,

                };
