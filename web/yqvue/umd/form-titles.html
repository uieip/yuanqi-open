<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
  <link rel="stylesheet" href="/test-ui.css">
    <title>YqTitlesEdit 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #e4e7ed;
            background-color: #fafafa;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #303133;
        }

        .content {
            padding: 20px;
        }

        .result-panel {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f7fa;
            border-radius: 4px;
        }

        .result-panel h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
            color: #606266;
        }

        .result-panel pre {
            background-color: #fff;
            padding: 10px;
            border-radius: 4px;
            overflow: auto;
            max-height: 300px;
            font-size: 12px;
        }

        .editor-container {
            height: 500px;

        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <h1>901：YqTitlesEdit、YqTitlesText 组件测试</h1>
            </div>
            <div class="content">
                <div style="width: 300px; margin-bottom: 20px;">
                    <yq-titles-text v-model:value="titlesValue" :is-edit="isEdit"></yq-titles-text>
                </div>
                <div class="editor-container">
                    <yq-titles-edit v-model:value="titlesValue" :is-edit="isEdit"></yq-titles-edit>
                </div>
                <div class="result-panel">
                    <h3>当前 value 值：</h3>
                    <pre>{{ JSON.stringify(titlesValue, null, 2) }}</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, watch } = Vue;
        const { initTheme, YqTitlesEdit, YqTitlesText } = YqwinPlus;
        initTheme();

        const app = createApp({
            components: {
                YqTitlesEdit,
                YqTitlesText
            },
            setup() {
                const titlesValue = ref({
                    titles: [
                        {
                            name: "field1",
                            ui_title: "字段1",
                            ui_type: 2,
                            ui_width: 100,
                            ui_visible: true,
                            ui_readonly: false,
                            ui_mask: {
                                default: "",
                                blank: false
                            }
                        },
                        {
                            name: "field2",
                            ui_title: "字段2",
                            ui_type: 3,
                            ui_width: 80,
                            ui_visible: true,
                            ui_readonly: false,
                            ui_mask: {
                                default: false
                            }
                        },
                        {
                            name: "field3",
                            ui_title: "字段3",
                            ui_type: 6,
                            ui_width: 120,
                            ui_visible: true,
                            ui_readonly: false,
                            ui_mask: {
                                default: 1,
                                lists: [
                                    { no: 1, name: "选项1" },
                                    { no: 2, name: "选项2" },
                                    { no: 3, name: "选项3" }
                                ]
                            }
                        }
                    ],
                    model: []
                });

                const isEdit = ref(true);

                watch(titlesValue, (newVal) => {
                    console.log('titlesValue changed:', newVal);
                }, { deep: true });

                return {
                    titlesValue,
                    isEdit
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>

</html>
