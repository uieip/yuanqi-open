    <title>Document</title>
    <style>
        body {
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }
        #app {
            padding: 20px;
        }
    </style>

    <div id="app">
        <el-switch v-model="isEdit" :active-value="true" :inactive-value="false" active-color="#13ce66"
            inactive-color="#ff4949" active-text="编辑" inactive-text="查看"></el-switch> |
             <span>编辑模式</span>
        <el-select v-model="editType" placeholder="请选择" style="width: 120px;">
            <el-option label="行编辑模式" :value="0"></el-option>
            <el-option label="属性编辑模式" :value="1"></el-option>
            <el-option label="form编辑模式" :value="2"></el-option>
        </el-select>|
        <el-switch v-model="defaultExpandAll" :active-value="true" :inactive-value="false" active-text="默认全部展开"
            inactive-text="默认不展开"></el-switch> |
        <label>冻结列数</label>
        <el-input v-model="frozenNum" type="number" placeholder="冻结列数" min="0" max="titles.length" step="1"
            style="width: 80px;"></el-input> |
        <el-switch v-model="mini" :active-value="true" :inactive-value="false" active-text="迷你模式"
            inactive-text="普通模式"></el-switch> |
            
        <p>-------------------------------------</p>
        titles <el-select v-model="changeTitle" placeholder="请选择" style="width: 120px;" @change="changeTitles">
            <el-option v-for="item in titles_all" :key="item.name" :label="item.name" :value="item.value"></el-option>
        </el-select> |
        rows <el-select v-model="changeRow" placeholder="请选择" style="width: 120px;" @change="changeRows">
            <el-option v-for="item in rows_all" :key="item.name" :label="item.name" :value="item.value"></el-option>
        </el-select> |
        <p>-------------------------------------</p>
        <div style="width:350px;">
            <yq-tree-text ref="treeRef" :is-demo="isDemo" :titles="titles" v-model:rows="rows" v-model:fkrows="fkrows"
                :is-edit="isEdit" :edit-type="editType" :default-expand-all="defaultExpandAll" :frozen-num="frozenNumInt" :mini="mini"
                @row-click="handleRowClick"></yq-tree-text>
        </div>

        <p>-------------------------------------</p>
        <div style="height: 40vh;width: 100%;  overflow: auto;">
            <yq-tree-edit ref="treeRef" :is-demo="isDemo" :titles="titles" v-model:rows="rows" v-model:fkrows="fkrows"
                :is-edit="isEdit" 
                :edit-type="editType"
                :default-expand-all="defaultExpandAll" :frozen-num="frozenNumInt" :mini="mini"
                
                @row-click="handleRowClick"></yq-tree-edit>
        </div>
        <p>-------------------------------------</p>
        <div style="height: 20vh;width: 100%;  overflow: auto;">
            {{ rows }}
        </div>
    </div>

                },

                    this.$refs.treeRef.upp(1)
                },
                handleDel() {
                    if (!this.row) {

                    }
                    if (this.row["_action"]) {
                        return
                    }
                    this.$refs.treeRef.del(this.key)
                },
