<!DOCTYPE html>
<html lang="en">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
  <link rel="stylesheet" href="/test-ui.css">
    <title>tree base</title>
    <style>
        body {
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }
        #app {
            padding: 20px;
        }
    </style>
</head>

<body>
    <div id="app">
        <el-switch v-model="isEdit" active-value="true" inactive-value="false" active-text="编辑"
            inactive-text="查看"></el-switch> |
        <el-switch v-model="defaultExpandAll" active-value="true" inactive-value="false" active-text="默认全部展开"
            inactive-text="默认不展开"></el-switch> |
        <label>冻结列数</label>
        <el-input v-model="frozenNum" type="number" placeholder="冻结列数" min="0" max="titles.length" step="1"
            style="width: 80px;"></el-input>|
        <el-switch v-model="checkBoxCol" active-value="true" inactive-value="false" active-text="显示复选框"
            inactive-text="隐藏复选框" v-show="!isEditBool"></el-switch>
        <p>-------------------------------------</p>
        titles <el-select v-model="changeTitle" placeholder="请选择" style="width: 120px;" @change="changeTitles">
            <el-option v-for="item in titles_all" :key="item.name" :label="item.name" :value="item.value"></el-option>
        </el-select> |
        rows <el-select v-model="changeRow" placeholder="请选择" style="width: 120px;" @change="changeRows">
            <el-option v-for="item in rows_all" :key="item.name" :label="item.name" :value="item.value"></el-option>
        </el-select> |
        <p>-------------------------------------</p>

        <el-button type="primary" @click="handleAddRoot">添加根节点</el-button>
        <el-button type="primary" @click="handleAdd">添加子节点</el-button>
        <el-button type="primary" @click="handleUpp">修改</el-button>
        <el-button type="primary" @click="handleDel">删除</el-button>
        <el-button type="primary" @click="handleRemove">移除</el-button>
        <el-button type="primary" @click="handleMove">排序</el-button> |
        <el-button type="primary" @click="handleCopy">复制</el-button>
        <el-button type="primary" @click="handleCut">剪切</el-button>
        <el-button type="primary" @click="handleUnCut">取消剪切/复制</el-button>
        <el-button type="primary" @click="handlePaste">粘贴</el-button>
        <div style="height: 40vh;width: 100%;  overflow: auto;">
            <yq-tree ref="treeRef" :is-demo="isDemo" :titles="titles" v-model:rows="rows" v-model:fkrows="fkrows"
                :is-edit="isEditBool" :default-expand-all="defaultExpandAllBool" :frozen-num="frozenNumInt"
                :check-box-col="checkBoxColBool" @row-click="handleRowClick"></yq-tree>
        </div>
        <p>-------------------------------------</p>
        <div style="height: 20vh;width: 100%;  overflow: auto;">
            {{ rows }}
        </div>
    </div>

                    titles.value = titles_all.value.find(item => item.value === changeTitle.value).titles;
                }

                const changeRow = ref("rows_1")
                const rows_all = computed(() => {
                    return [
                        { name: "rows_1", value: "rows_1", rows: rows_1 },
                        { name: "rows_2", value: "rows_2", rows: rows_2 }]
                });
                function changeRows() {
                    console.log(rows_all.value, changeRow.value)
                    const foundItem = rows_all.value.find(item => item.value === changeRow.value)
                    if (foundItem) {
                        rows.value = foundItem.rows
                    } else {
                        console.warn('未找到对应的 rows:', changeRow.value)
                        // 可以设置默认值或保持当前值
                    }
                }

                const titles = ref(titles_1);
                const rows = ref(rows_1);

                const fkrows = ref([])
                watch(fkrows, (newValue, oldValue) => {
                    console.log("fkrows", newValue)
                }, { deep: true })

                return {
                    titles,
                    rows,
                    index,
                    fkrows,
                    changeTitle,
                    titles_all,
                    changeTitles,
                    changeRow,
                    rows_all,
                    changeRows,

                isEditBool() {

                defaultExpandAllBool() {

                },
                frozenNumInt() {

                },
                checkBoxColBool() {
                    return this.checkBoxCol === 'true'
                },

                handleRowClick({ row, key }) {
                    this.key = key
                    this.row = row
                    console.log(`点击行索引: ${key}`)
                    console.log(`点击行数据: ${JSON.stringify(row, null, 2)}`)
                },
                handleAddRoot() {
                    this.$refs.treeRef.add({})
                },
                handleAdd() {
                    if (!this.row) {
                        return
                    }
                    this.$refs.treeRef.add({}, this.key)
                },
                handleUpp() {
                    this.$refs.treeRef.upp(1)
                },
                handleDel() {
                    if (!this.row) {
                        return
                    }
                    if (this.row["_action"]) {
                        return
                    }
                    this.$refs.treeRef.del(this.key)
                },
                handleRemove() {
                    if (!this.row) {
                        return
                    }
                    this.$refs.treeRef.remove(this.key)
                },
                handleMove() {
                    this.$refs.treeRef.queue((rows) => {
                        console.log("queue", rows)
                        this.$refs.treeRef.setRows(rows)
                    })
                },
                handleCopy() {
                    this.$refs.treeRef.copy(this.key)
                },
                handleCut() {
                    this.$refs.treeRef.cut(this.key)
                },
                handleUnCut() {
                    this.$refs.treeRef.unCutCopy()
                },
                handlePaste() {
                    this.$refs.treeRef.paste(this.key)
                },
            }
        })
        app.use(ElementPlus)

</body>

</html>
