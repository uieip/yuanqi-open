<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
  <link rel="stylesheet" href="/test-ui.css">
    <title>YqUiMask 测试</title>
    <!-- 自定义样式 -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #e4e7ed;
            background-color: #fafafa;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #303133;
        }

        .content {
            padding: 20px;
        }

        .type-selector {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f7fa;
            border-radius: 4px;
        }

        .type-selector label {
            font-weight: bold;
            margin-right: 10px;
        }

        .result-panel {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f7fa;
            border-radius: 4px;
        }

        .result-panel h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
            color: #606266;
        }

        .result-panel pre {
            background-color: #fff;
            padding: 10px;
            border-radius: 4px;
            overflow: auto;
            max-height: 300px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <h1>900：YqUiMaskEdit、YqUiMaskText 组件测试</h1>
            </div>
            <div class="content">
                <div class="type-selector">
                    <label>选择 ui_type：</label>
                    <el-select v-model="currentUiType" placeholder="请选择 ui_type" style="width: 300px;"
                        @change="onUiTypeChange">
                        <el-option v-for="item in uiTypeOptions" :key="item.value" :label="item.label"
                            :value="item.value"></el-option>
                    </el-select>
                </div>

                <div style="margin-bottom: 20px;width: 400px;">
                    <yq-ui-mask-text :ui_type="currentUiType" v-model:value="maskValue"
                        :is-edit="true"></yq-ui-mask-text>
                </div>

                <div style="border: 1px solid #dcdfe6; border-radius: 4px; padding: 20px; min-height: 400px;">
                    <yq-ui-mask-edit :ui_type="currentUiType" v-model:value="maskValue"
                        :is-edit="true"></yq-ui-mask-edit>
                </div>

                <div class="result-panel">
                    <h3>当前 ui_mask 值：</h3>
                    <pre>{{ JSON.stringify(maskValue, null, 2) }}</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, watch } = Vue;
        const { initTheme, YqUiMaskEdit, YqUiMaskText } = YqwinPlus;
        initTheme();
        const app = createApp({
            components: {
                YqUiMaskEdit,
                YqUiMaskText
            },
            setup() {
                const currentUiType = ref(2);
                const maskValue = ref({});
                const uiMaskRef = ref(null);

                const uiTypeOptions = ref([
                    { value: 1, label: '1 - Label' },
                    { value: 2, label: '2 - Textbox' },
                    { value: 3, label: '3 - Checkbox' },
                    { value: 4, label: '4 - Datebox' },
                    { value: 5, label: '5 - RichTextBox' },
                    { value: 6, label: '6 - Combobox' },
                    { value: 7, label: '7 - Forienkey' },
                    { value: 8, label: '8 - Tree' },
                    { value: 9, label: '9 - NumberBox' },
                    { value: 10, label: '10 - NumberSpinner' },
                    { value: 11, label: '11 - TimeSpinner' },
                    { value: 12, label: '12 - DateTimeBox' },
                    { value: 13, label: '13 - NCheckBox' },
                    { value: 14, label: '14 - NForeignKey' },
                    { value: 15, label: '15 - Tbedit' },
                    { value: 16, label: '16 - Tree' },
                    { value: 17, label: '17 - Attr' },
                    { value: 18, label: '18 - File' },
                    { value: 19, label: '19 - Html' },
                    { value: 20, label: '20 - CSV分隔字符串' },
                    { value: 21, label: '21 - Func函数' },
                    { value: 900, label: '900 - ui_mask' },
                ]);

                const onUiTypeChange = (val) => {
                    maskValue.value = {};
                };

                watch(maskValue, (newVal) => {
                    console.log('maskValue changed:', newVal);
                }, { deep: true });

                return {
                    currentUiType,
                    maskValue,
                    uiMaskRef,
                    uiTypeOptions,
                    onUiTypeChange
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>

</html>
