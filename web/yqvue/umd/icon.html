  <script src="/yqvue/test-theme-switch.js" defer></script>
  <link rel="stylesheet" href="/yqvue/test-ui.css">
  <title>YQWIN-Plus 页面框架组件测试</title>
  <!-- 引入基础样式 -->
  <style>
    /* 页面样式调整 */
    body {
      display: block;
      margin: 0;
      padding: 0;
      background-color: var(--yq-bg);
      color: var(--yq-text);
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }
  </style>
</head>

    <div class="icon-test-container">
      <!-- 图标测试列表（按分类展示，参照 font-awesome 分类） -->
      <div class="icon-list">
        <div class="icon-list-toolbar">
          <el-input v-model="filterText" placeholder="搜索图标名称（如 arrow、user）" clearable size="default"
            class="filter-input">
            <template #prefix>
              <yq-icon icon="fa fa-magnifying-glass" size="14px" color="#909399"></yq-icon>
            </template>
          </el-input>
          <div class="toolbar-actions">
            <el-button size="small" @click="toggleAll">{{ isAllExpanded ? '全部折叠' : '全部展开' }}</el-button>
            <span class="icon-count">共 {{ filteredIcons.length }} 个图标</span>
          </div>
        </div>
        <el-collapse v-model="activeCategories" class="icon-categories">
          <el-collapse-item v-for="cat in categorizedIcons" :key="cat.name" :name="cat.name">
            <template #title>
              <div class="category-title">
                <span class="category-name">{{ cat.name }}</span>
                <el-tag size="small" type="info" effect="plain" round>{{ cat.icons.length }}</el-tag>
              </div>
            </template>
            <div class="icons-grid">
              <div v-for="icon in cat.icons" :key="icon" class="icon-item"
                :class="{ 'selected': selectedIcon === icon }" @click="copyIconName(icon)"
                :title="`点击复制：${icon}`">
                <yq-icon :icon="icon" :color="color" :size="size" :hover-color="hoverColor"
                  class="grid-icon"></yq-icon>
                <span class="icon-name">{{ icon }}</span>
              </div>
            </div>
          </el-collapse-item>
        </el-collapse>
        <div v-if="categorizedIcons.length === 0" class="empty-tip">没有匹配的图标</div>
      </div>
    </div>
  </div>

    /**
     * 将图标名归类
     * @param {string} icon 'fa fa-xxx'
     * @returns {string} 分类名（中英对照）；无匹配返回 'Other 其他'
     */
    function categorizeIcon(icon) {
      const name = icon.replace(/^fa fa-/, '');
      // 字母图标：单个字母
      if (/^[a-z]$/.test(name)) return 'Alphabet 字母';
      // 数字图标：单个数字
      if (/^[0-9]$/.test(name)) return 'Numbers 数字';
      for (const rule of CATEGORY_RULES) {
        // Numbers / Alphabet 已在上方提前返回，跳过其规则
        if (rule.name.startsWith('Numbers') || rule.name.startsWith('Alphabet')) continue;
        for (const kw of rule.keywords) {
          if (kw instanceof RegExp) {
            if (kw.test('fa-' + name)) return rule.name;
          } else if (name.indexOf(kw) !== -1) {
            return rule.name;
          }
        }
      }
      return 'Other 其他';
    }

          ],
          size: '20px',
          color: '#409eff',
          hoverColor: '#f56c6c',
          filterText: '',
          activeCategories: [],
        }
      },
      computed: {
        /**
         * 按当前关键字过滤后的图标列表
         * 空关键字时返回全部
         */
        filteredIcons() {
          const kw = (this.filterText || '').trim().toLowerCase();
          if (!kw) return this.testIcons;
          return this.testIcons.filter(icon => icon.toLowerCase().indexOf(kw) !== -1);
        },
        /**
         * 按 font-awesome 分类对图标分组
         * 同一类内保持原列表顺序；分类按 CATEGORY_RULES 顺序输出，未命中归入 'Other 其他'
         * 空分类（无图标）不显示
         */
        categorizedIcons() {
          // 先按类别收集
          const buckets = new Map();
          for (const icon of this.filteredIcons) {
            const cat = categorizeIcon(icon);
            if (!buckets.has(cat)) buckets.set(cat, []);
            buckets.get(cat).push(icon);
          }
          // 按 CATEGORY_RULES 顺序输出，未定义顺序的类别追加在末尾
          const ordered = [];
          const seen = new Set();
          for (const rule of CATEGORY_RULES) {
            const arr = buckets.get(rule.name);
            if (arr && arr.length) {
              ordered.push({ name: rule.name, icons: arr });
              seen.add(rule.name);
            }
          }
          // 'Other 其他' 与未在规则顺序中但出现的类别
          for (const [name, icons] of buckets) {
            if (seen.has(name)) continue;
            if (icons.length) ordered.push({ name, icons });
          }
          return ordered;
        },
        /** 所有分类名（用于全部展开） */
        allCategoryNames() {
          return this.categorizedIcons.map(c => c.name);
        },
        /** 是否所有分类均已展开（用于切换按钮显示文字） */
        isAllExpanded() {
          const total = this.allCategoryNames.length;
          return total > 0 && this.activeCategories.length === total;
        },
      },
      watch: {
        filterText() {
          // 过滤时保持所有结果可见
          this.activeCategories = this.allCategoryNames;
        },
      },
      methods: {
        /** 切换全部展开/折叠：已全部展开则折叠，否则展开全部 */
        toggleAll() {
          this.activeCategories = this.isAllExpanded
            ? []
            : this.allCategoryNames;
        },
        /**
         * 点击图标：选中并把图标名（如 'fa fa-home'）写入剪贴板，
         * 便于在使用处直接粘贴为 yq-icon 的 icon 属性值。
         * 兼容非安全上下文（http/无 HTTPS）下的 clipboard API 缺失场景。
         */
        async copyIconName(icon) {
          this.selectedIcon = icon;
          let ok = false;
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(icon);
              ok = true;
            }
          } catch (e) {
            // 落入下面的兜底分支
          }
          if (!ok) {
            // 兜底：临时 textarea + execCommand('copy')，兼容 HTTP/旧浏览器
            try {
              const ta = document.createElement('textarea');
              ta.value = icon;
              ta.style.position = 'fixed';
              ta.style.top = '-9999px';
              document.body.appendChild(ta);
              ta.focus();
              ta.select();
              ok = document.execCommand('copy');
              document.body.removeChild(ta);
            } catch (e) {
              ok = false;
            }
          }
          ok
            ? ElMessage.success({ message: `已复制：${icon}`, grouping: true, duration: 1500 })
            : ElMessage.warning({ message: '复制失败，请手动选择文本复制', grouping: true });
        },
      },
      mounted() {
        // 默认展开所有分类
        this.activeCategories = this.allCategoryNames;
      },
      setup() {
        const selectedIcon = ref('fa fa-home')
        return {
          selectedIcon
        }
      }
    })
