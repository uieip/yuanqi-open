<script src="/yqvue/test-theme-switch.js" defer></script>
<uieip type="reg" value="console,login,session"></uieip>
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
  <link rel="stylesheet" href="/yqvue/test-ui.css">
    <title>数据表格测试</title>
    <style>
        body {
            background-color: var(--yq-bg);
            color: var(--yq-text);
        }

    </style>
</head>

<body style="padding: 0;margin: 0;">
    <div id="app" style="display: flex; flex-direction: column; gap: 12px; padding: 20px; max-width: 480px; margin: 0 auto;">
        <h3 style="margin: 0; text-align: center;">密码校验测试</h3>
        <el-input v-model="password" placeholder="请输入密码" clearable>
            <template #prepend>密码</template>
        </el-input>
        <el-select v-model="selectedHashType" placeholder="请选择Hash类型" clearable>
            <el-option v-for="item in hashTypes" :key="item" :label="item" :value="item" />
        </el-select>
        <el-input v-model="salt" placeholder="请输入盐" clearable>
            <template #prepend>盐值</template>
        </el-input>
        <el-input v-model="jsPassword" readonly placeholder="js加密后的密码">
            <template #prepend>JS</template>
        </el-input>
        <el-input v-model="svrPassword" readonly placeholder="服务器加密后的密码">
            <template #prepend>SVR</template>
        </el-input>
        <div style="display: flex; align-items: center; gap: 12px;">
            <el-tag :type="check ? 'success' : 'danger'" effect="dark">
                {{ check ? 'check pass' : 'check fail' }}
            </el-tag>
            <el-button type="primary" @click="encodePassword">check</el-button>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        const { initTheme, PasswordEncoder, yqData } = YqwinPlus;
        initTheme();

        const initApp = () => {
            const app = createApp({
                components: {

                },

                setup() {
                    const hashTypes = PasswordEncoder.hashTypes
                    const selectedHashType = ref(hashTypes[0])
                    const password = ref('123456')
                    const salt = ref('654321')
                    const jsPassword = ref('')
                    const svrPassword = ref('')
                    const check = ref(false)

                    const svrResult = async () => {
                        const formData = new FormData();
                        formData.append('action', 'test');
                        formData.append('passwd', password.value);
                        formData.append('salt', salt.value);
                        formData.append('type', selectedHashType.value);
                        const res = await yqData.post('/_login.html', formData)

                        return res
                    }

                    const encodePassword = async () => {
                        jsPassword.value = await PasswordEncoder.hashBase64(password.value, salt.value, selectedHashType.value)

                        const res = await svrResult()
                        if (res.error === 0) {
                            svrPassword.value = res.hashed
                            check.value = jsPassword.value === svrPassword.value
                            console.log("check password");
                            console.log(JSON.stringify({
                                password: password.value,
                                salt: salt.value,
                                type: selectedHashType.value,
                                jsPasswordBase4: jsPassword.value,
                                svrPasswordBase4: svrPassword.value,
                                check: check.value
                            }, null, 2));
                            console.log(check.value ? "check pass" : "check fail");
                        }
                    }

                    return {
                        hashTypes,
                        selectedHashType,
                        password,
                        salt,
                        jsPassword,
                        svrPassword,
                        encodePassword,
                        check
                    }
                }
            })

            app.use(ElementPlus)
            app.mount('#app')
        }

        window.onload = async function () {
            initApp();
        }
    </script>
</body>

</html>
