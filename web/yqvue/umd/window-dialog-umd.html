<!DOCTYPE html>
<html lang="en">
<head>
  <uieip type="file" value="inc" src="/scripts/yqwin_inc.txt"></uieip>
  <link rel="stylesheet" href="/test-ui.css">
  <title>YqDialog UMD 格式测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: var(--yq-bg);
      color: var(--yq-text);
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .test-link {
      display: inline-block;
      margin: 5px 10px;
      padding: 8px 16px;
      background-color: #409eff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
    .test-link:hover {
      background-color: #66b1ff;
    }

    .test-button {
      padding: 8px 16px;
       background-color: #67c23a; 
       color: white;
        border: none;
         border-radius: 4px; 
         cursor: pointer;
    }
  </style>
  <!-- 引入项目的样式 -->
  <link rel="stylesheet" href="../src/style.css">
</head>
<body>
  <div class="test-container">
    <h1>YqDialog UMD 格式测试</h1>
    <div>
      <a href="/test/layout.html" class="test-link">返回布局测试</a>
      <a href="/index.html" class="test-link">返回首页</a>
    </div>
    <div id="app">
      <h2>YqDialog UMD 格式示例</h2>
      <button class="test-button" @click="createDialogDynamically('自定义标题')">动态创建对话框</button>
    </div>
  </div>

  <script>
    // 确保所有脚本都已加载完成
    document.addEventListener('DOMContentLoaded', () => {
      // 使用 UMD 格式的 yqwin-plus
      const { dialogManager, YqDialogManager, initTheme } = window.YqwinPlus;
      if (initTheme) initTheme();
      
      const { createApp } = Vue;
      
      const app = createApp({
      methods: {
        createDialogDynamically(title) {
          // 支持使用dialogManager和YqDialogManager
          (YqDialogManager || dialogManager).show({
            title: title || '动态创建的对话框',
            content: '这是通过 UMD 格式调用 dialogManager 动态创建的 YqDialog 弹框',
            showClose: true,
            top: '15vh',
            modal: true,
            destroyOnClose: true,
            confirm: () => {
              console.log('用户点击了确定按钮');
            },
            cancel: () => {
              console.log('用户点击了取消按钮');
            }
          });
        }
      }
    });

    app.use(ElementPlus);
    app.mount('#app');

    window.dialog = app;
    });
  </script>

</body>
</html>
